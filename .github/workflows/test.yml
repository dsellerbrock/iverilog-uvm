name: test

on:
  # Every push onto the main branch triggers a retest.
  push:
    branches:
      - main
  # All pull_requests trigger a retest.
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  mac:
    strategy:
      fail-fast: false
    runs-on: macos-15-intel
    name: '🍏 macOS'
    steps:

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install
      run: |
        brew install bison z3 libffi
        pip3 install --break-system-packages docopt || pip3 install docopt

    - name: Build
      run: |
        export PATH="$(brew --prefix bison)/bin:$PATH"
        export CPPFLAGS="-I$(brew --prefix z3)/include -I$(brew --prefix libffi)/include"
        export LDFLAGS="-L$(brew --prefix z3)/lib -L$(brew --prefix libffi)/lib"
        autoconf
        ./configure --enable-libveriuser
        make -j$(sysctl -n hw.logicalcpu)

    - name: Self-check
      run: |
        export PATH="$(brew --prefix bison)/bin:$PATH"
        export CPPFLAGS="-I$(brew --prefix z3)/include -I$(brew --prefix libffi)/include"
        export LDFLAGS="-L$(brew --prefix z3)/lib -L$(brew --prefix libffi)/lib"
        make check

    - name: Install binary
      run: sudo make install

    - name: Regression tests
      continue-on-error: true
      run: ./.github/test.sh

    # The broad lane above has historical soft failures. Keep newly merged
    # virtual-interface function semantics zero-tolerance on every host.
    - name: Virtual-interface function focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-function-focus-legacy.list regress-vif-function-focus-vvp.list

    - name: Parameterized virtual-interface specialization focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-parameter-specialization-focus-legacy.list regress-vif-parameter-specialization-focus-vvp.list

    # macOS UVM builds and loads the real DPI umbrella. Keep this hard-gated;
    # the authoritative test count comes from the current checkout rather than
    # a stale count embedded in this workflow comment.
    - name: UVM regression tests
      run: ./.github/uvm_test.sh

    # Validate the simplified `iverilog -uvm' front end end-to-end against a
    # freshly installed, relocated toolchain (real DPI, custom prefix).
    - name: UVM front-end regression
      run: ./.github/uvm_frontend_test.sh


  lin:
    strategy:
      fail-fast: false
      matrix:
        os: [
          '22.04',
          '24.04'
        ]
    runs-on: ubuntu-${{ matrix.os }}
    name: '🐧 Ubuntu ${{ matrix.os }}'
    steps:

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install
      run: |
        sudo apt update -qq
        sudo apt install -y make g++ git bison flex gperf libreadline-dev libbz2-dev autoconf python3-sphinx python3-docopt libz3-dev libffi-dev

    - name: Build
      run: |
        autoconf
        ./configure --enable-libveriuser
        make -j$(nproc)

    - name: Self-check
      run: make check

    - name: Install binary
      run: sudo make install

    - name: ivtest gate (name-diff, hard)
      run: ./.github/ivtest_gate.sh

    # Re-run the small paired focus, including the JSON/VVP descriptor path
    # omitted by the full hard gate above, as a cross-harness feature gate.
    - name: Virtual-interface function focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-function-focus-legacy.list regress-vif-function-focus-vvp.list

    - name: Parameterized virtual-interface specialization focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-parameter-specialization-focus-legacy.list regress-vif-parameter-specialization-focus-vvp.list

    - name: UVM regression tests (hard)
      run: ./.github/uvm_test.sh

    # Validate the simplified `iverilog -uvm' front end end-to-end against a
    # freshly installed, relocated toolchain (real DPI, custom prefix).
    - name: UVM front-end regression (hard)
      run: ./.github/uvm_frontend_test.sh

    # Annex H maps SV byte to plain C char. Exercise the host branch where
    # plain char is unsigned by rebuilding the runtime and its DPI companion
    # with the same ABI mode; the ordinary gate above covers default-char.
    - name: Unsigned plain-char DPI ABI
      run: |
        touch vvp/vvp_dpi.cc
        make -C vvp CXXFLAGS="-g0 -O2 -std=c++11 -funsigned-char" vvp
        IVERILOG="$(command -v iverilog)" \
        IVPI="$(command -v iverilog-vpi)" \
        VVP="$PWD/vvp/vvp" \
        DPI_CHAR_CFLAGS="-funsigned-char" \
          bash tests/vvp_runtime/run_dpi_plain_char_abi.sh

    - name: Documentation
      run: |
        cd Documentation
        make html


  win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { msystem: MINGW64, env: x86_64 }
          - { msystem: UCRT64,  env: ucrt-x86_64 }
          - { msystem: CLANG64, env: clang-x86_64 }
    name: 🟪 ${{ matrix.msystem}}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MINGW_ARCH: ${{ matrix.msystem }}
    steps:

    - run: git config --global core.autocrlf input
      shell: bash

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >
          git
          base-devel
          mingw-w64-${{ matrix.env }}-python-pip
          mingw-w64-${{ matrix.env }}-perl
          mingw-w64-${{ matrix.env }}-z3
          mingw-w64-${{ matrix.env }}-libffi
          mingw-w64-${{ matrix.env }}-libsystre

    - name: Install Python dependencies
      run: pip3 install docopt

    - name: Build and self-check
      run: |
        cd msys2
        if [ "${{ matrix.msystem }}" != "CLANG64" ] ; then
            export IVL_CONFIG_OPTIONS="--enable-libveriuser"
        fi
        makepkg-mingw --noconfirm --noprogressbar -sCLf

    - name: Install binary
      run: pacman -U --noconfirm msys2/*.zst

    - name: DPI/regex diagnostic probe
      continue-on-error: true
      run: bash .github/win_dpi_probe.sh 2>&1 | tee "win_probe_${{ matrix.msystem }}.txt"

    - name: Upload probe output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-${{ matrix.msystem }}
        path: win_probe_${{ matrix.msystem }}.txt

    - name: Regression tests
      continue-on-error: true
      run: |
        if [ "${{ matrix.msystem }}" = "CLANG64" ] ; then
            ./.github/test.sh no-pli1
        else
            ./.github/test.sh
        fi

    # Windows' broad regression has recorded unrelated failures and remains a
    # soft signal. This focused pair is the hard feature-specific protection.
    - name: Virtual-interface function focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-function-focus-legacy.list regress-vif-function-focus-vvp.list

    - name: Parameterized virtual-interface specialization focus (hard)
      run: bash .github/ivtest_focus_gate.sh regress-vif-parameter-specialization-focus-legacy.list regress-vif-parameter-specialization-focus-vvp.list

    # Windows UVM runs real DPI on all three MSYS2 toolchains, so this step is
    # hard-gated. The authoritative test count comes from the current checkout.
    # The plain regression suite above keeps its soft gate because its Windows
    # baseline has known non-UVM deltas that are tracked separately.
    - name: UVM regression tests
      run: ./.github/uvm_test.sh

    # Validate the `iverilog -uvm' front end on the INSTALLED Windows toolchain
    # (pacman-installed above), which carries uvm_dpi.vpi only if installuvm's
    # Windows hand-rolled umbrella build succeeded during packaging. Asserts
    # REAL DPI (not a UVM_NO_DPI fallback) via a necessity contrast, so a silent
    # revert to no-DPI fails here.
    - name: UVM front-end (installed toolchain, real DPI)
      run: |
        set -e
        base="$(dirname "$(dirname "$(command -v iverilog)")")/lib/ivl"
        echo "resolved toolchain base: $base"
        if [ ! -f "$base/uvm_dpi.vpi" ]; then
          echo "uvm_dpi.vpi NOT installed. Diagnosing the umbrella build inline..."
          echo "  UVM sources installed? $( [ -f "$base/uvm/src/uvm_pkg.sv" ] && echo yes || echo no )"
          echo "  iverilog-vpi: $(command -v iverilog-vpi || echo MISSING)"
          echo "  --- iverilog-vpi --ccflags ---"; iverilog-vpi --ccflags 2>&1 || true
          echo "  --- iverilog-vpi --ldflags ---"; iverilog-vpi --ldflags 2>&1 || true
          echo "  --- rebuild umbrella (trace) ---"
          IVPI="$(command -v iverilog-vpi)" VVP_DEF="$PWD/vvp/vvp.def" \
            sh -x uvm_dpi/build_uvm_dpi.sh --name=/tmp/diag_uvm_dpi \
            -I. -Iuvm-core/src/dpi uvm_dpi/uvm_dpi_iverilog.cc 2>&1 | tail -60 || true
          echo "FAIL: uvm_dpi.vpi not installed (installuvm fell back to UVM_NO_DPI)"; exit 1
        fi
        test -f "$base/uvm/src/uvm_pkg.sv" || { echo "FAIL: UVM sources not installed"; exit 1; }
        cp tests/reg_basic_test.sv /tmp/fe_tb.sv
        cd /tmp
        iverilog -g2012 -uvm -o fe.vvp fe_tb.sv
        grep -q ':vpi_module "[^"]*uvm_dpi' fe.vvp \
          || { echo "FAIL: uvm_dpi not baked into the compiled program"; exit 1; }
        out="$(vvp fe.vvp 2>&1)"; echo "$out" | tail -6
        echo "$out" | grep -q 'UVM_ERROR :    0' || { echo "FAIL: run not clean"; exit 1; }
        if echo "$out" | grep -q 'DPI error'; then echo "FAIL: unresolved DPI symbols"; exit 1; fi
        # Necessity: the same design in real-DPI mode with NO provider must
        # report the missing native symbols, proving DPI is genuinely used.
        iverilog -g2012 -I "$base/uvm/src" -o nomod.vvp "$base/uvm/src/uvm_pkg.sv" fe_tb.sv
        vvp nomod.vvp 2>&1 | grep -q 'DPI error' \
          || { echo "FAIL: necessity check — design did not need native DPI"; exit 1; }
        echo "PASS: iverilog -uvm runs REAL DPI on the installed Windows toolchain"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.msystem }}
        path: msys2/*.zst
