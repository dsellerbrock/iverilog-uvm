implementation_plan: Add a type-only PEIdent resolver guarded by parsed class-scope provenance; reuse class identity/specialization helpers and reject typedef lookup escaping the selected class/superclass. Call it only for a type parameter before existing unqualified fallback.

scope_refinement: Scoped type actuals must enter specialization keys by resolved type identity; otherwise qualifier arguments are lost in PEIdent textual fallback and9/17bit actuals collide. This is required by the active positive specialization control, not unrelated work.

