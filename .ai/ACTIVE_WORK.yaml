causal_mechanism: Shared splicer recursively expanded parameterized calls but copied bare alias bodies without recursively resolving their contents; Pair calls reached ordinary function elaboration.
implementation:
  - Recursively expand cloned bare alias body before insertion and release replaced identifier.
  - Bare alias nested sequence lookup uses declaration generate scope; parameterized substituted actual lookup retains caller scope.
  - Active declaration path rejects reentry before cloning; newly detected errors stop sibling expansion, preserving depth safeguard and avoiding exponential branching cycles.
