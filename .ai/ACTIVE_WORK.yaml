blocker: OT-SPI-INLINE-STATE-FUNCTION-CALL
status: PATCHED
base: 3ccd5d73e691411caf43b407f05c84ddcade8820
parent_pr: https://github.com/dsellerbrock/iverilog-uvm/pull/320 (merged as 1af223c8f)
objective: Evaluate permitted function calls in inline randomize constraints using the existing constraint-function machinery, preserving caller/target lookup and runtime receiver semantics.
authorization: Continuous campaign; previous caller-queue patch locally qualified and published frozen in PR320.
standards:
- IEEE 1800-2017 18.5.12 and 18.7
- IEEE 1800-2023 18.5.11 and 18.7
edition_note: 2023 explicitly prohibits inout and requires side-effect-free behavior; 2017 wording differs. const ref remains allowed. Do not conflate function-argument ordering with solve-before.
reproducer: evidence/review-20260920/spi-external-cfg-constraint-next/external_cfg_constraint.sv
red: results/current-build3/results.json records both-edition inline failure and passing class-body control.
root_hypothesis: Inline lowering lacks state-call context and descriptor plumbing present for class-body constraints.
allowed_scope:
- Trace and reuse existing state-function descriptor, receiver capture, purity validation, pre-solve call and result capture.
- elab_expr.cc and elaborate.cc inline lowering plus existing declarations if necessary.
- tgt-vvp and vvp state-call serialization/execution only after identifying specific required symbols and recording dependency.
- Directly related focused regressions and owning documents.
forbidden:
- Application source modifications or dropped constraints.
- Replacing function calls with guessed constants or bidirectional symbolic substitution.
- Unrelated nested-struct or queue-type changes.
- New IR architecture without explicit coordinator scope review.
acceptance:
- External caller cfg method returns actual 1/2/4 across calls in both editions.
- Target/self receiver, caller scope, virtual dispatch and repeated state changes behave correctly.
- Null receiver and invalid function forms diagnose; unsatisfiable result preserves target state.
- Existing class-body constraint function behavior, argument ordering and pre_randomize semantics preserved.
- Focused positive/negative/boundary tests and mapped gates; broad validation at coherent checkpoint before promotion.
lanes:
  implementation: Retained Terra selected_vif_relay_lifetime; authorized external state-only implementation phase below.
  coordinator: Standards, scope selection, shared builds/install/test output, integration and review.
risk: HIGH
stop_after_completion: Freeze validated patch; return to coordinator selection. Full mission remains active.

additional_evidence:
  inline_virtual_pre_red: evidence/review-20260920/spi-external-cfg-constraint-next/coordinator/virtual-red.json
  class_virtual_pre_control: evidence/review-20260920/spi-external-cfg-constraint-next/coordinator/virtual-control.json
  required_invariant: Invoke the derived virtual method on actual caller cfg after target pre_randomize updates aliased state; paired control returns4.
  scope_hazard: Existing capture wrapper is parented to randomized class and has only target-this port; enabling context alone cannot preserve caller lexical cfg/automatic lifetime.

implementation_phase:
  goal: First implement the exact external caller-state function path through existing post-pre_randomize scalar captures; this is a phase, not closure of remaining acceptance items.
  authorized_files:
  - elaborate.cc shared function resolver/purity/direction validation and caller-state slot lowering
  - elab_expr.cc slot elaboration/classification and null guard if required
  - vvp/vthread.cc retain four-state words for function-result slots
  - vvp/vvp_z3.cc typed function-result substitution and transactional X/Z failure
  - necessary declarations only after explicit dependency report
  invariants:
  - No duplicate receiver evaluation; preserve live caller frame and virtual dispatch.
  - Null receiver must fail even for constant-return method; X/Z must not become zero.
  - Reuse shared purity and direction checks; const-ref stays allowed.
  - Only proven state-only arguments may use direct capture. Random-dependent inputs remain diagnosed until staged evaluation is implemented.
  - Target-first lookup must not accidentally resolve a target method/property in caller scope. Unsupported target forms stay loud during this phase.
  remaining_in_ticket: Target/self lookup and staged random-argument support require subsequent explicit review; do not claim full inline-function support or close broad acceptance prematurely.
  forbidden_expansion: No new per-call descriptor dispatch system or synthetic lexical-parent wrapper without separately proven lifetime/receiver semantics.

declaration_dependency_approved:
- Optional function_slot_flags parameter on pexpr_to_class_constraint_ir and rooted sibling, limited to definitions in elaborate.cc and declarations/caller in elab_expr.cc.
- Inline lowering owns flag rollback alongside value slots; no new shared header/module.
negative_controls: evidence/review-20260920/spi-external-cfg-constraint-next/coordinator/null-x-control.json proves both-edition class-body null/X rejection preserves target and suppresses post hook.

