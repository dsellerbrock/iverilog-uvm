    actual: Both editions reject a fixed first-clock sequence prefix followed by a finite ranged second-clock sequence, with a focused missing plain transport diagnostic.
    expected: One sequence-property verdict when any second-clock alternative matches; preserve the full fixed prefix and nearest or strictly subsequent clock boundary.
    owns: [pform.cc, pform_sva_nfa.cc, pform_sva_nfa.h]
    test_prefix: sv_assert_plain_multiclock_consequence_nfa
    dependencies: L100 finite consequence masks and existing fixed plain controls; independent of evaluator lane.
