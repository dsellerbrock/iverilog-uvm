id: L06
title: Initialize queues of default-initialized structs as empty queues
status: in_progress
phase: reproduced
base_revision: 03caa64c832a9c1b22b82a5692fda7764c94ebc9
last_validated_revision: 03caa64c832a9c1b22b82a5692fda7764c94ebc9
standards:
  - IEEE1800-2017 and IEEE1800-2023 7.10 queue initial value;7.2.2 structure member initialization.
selection_reason: Official UVM2020.3.2 reg-map queue of uvm_reg_bus_op with data=0 is rejected; legal empty container initialization is a concrete remaining standards and release-compatibility obligation from DD011.
reproducer: ../evidence/campaign-20260908/l06/queue-default.sv
expected_behavior: Queue declarations without explicit initializers begin empty regardless of struct element defaults; no nonexistent element is initialized. Scalar struct construction and invalid type-default diagnostics remain intact.
root_cause_hypothesis: pform_make_struct_member_defaults treats all nonscalar storage as unsupported rather than distinguishing empty queue containers; class/const and nested typedef paths need causal tracing before selecting the smallest shared correction.
allowed_scope:
  - Queue declaration/type classification and synthesized struct-member initialization at affected pform callers.
  - Permanent paired controls for direct/typedef/class/automatic/static/nested queue declarations, explicit insertion and scalar-default behavior; invalid type defaults must still reject.
  - Exact LRM/source trace, focused and required integrated gates, official2020.3.2 replay and scoped documentation.
non_goals:
  - No nonstandard legacy delay syntax extension, UVM/library edits, unrelated resource-type fixes or broad structure-default completion claim.
  - No warning removal, dropped element defaults or fabricated queue contents.
required_gates:
  - Paired baseline reducer, primary standards evidence and independently reviewed causal patch.
  - Focused legacy/JSON,affected struct/queue neighbors,integrated,VPI,negative,runtime,NFA,fullJSON,real-DPIUVM,makecheck.
  - UVM2020.3.2 release probe; getting further is not a release pass.
completion: Close only the validated queue-container initialization scope; broader struct defaults and application qualification stay open.
stop_after_completion: false
discovery_policy: Unrelated discoveries record-only; any required prerequisite gets a deliberate preserved-work boundary.
next_action: Reproduce both editions and trace shape classification plus every initializer caller before editing implementation.
baseline_evidence: Both2017/2023 fail queue-default.sv at declaration with the unsupported-struct-default queue diagnostic on validated03caa64c8.
causal_trace: pform_make_struct_member_defaults rejects all nonscalar shapes; pform_has_implicit_struct_member_defaults drives const guards in pform_make_var and pform_class_property; nested pform_append_struct_member_defaults and pform_struct_has_member_defaults recurse through queue element types. Shape helper currently prioritizes typedef dimensions over declaration dimensions, so outer queue typedef-array cases require explicit controls. Type-default validation is separate and must remain unconditional.
