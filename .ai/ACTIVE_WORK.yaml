  owner: Reused GPT-6 Luna medium owns only net_link.cc, netlist.h, net_nex_input.cc and dedicated paired tests; coordinator owns shared builds, manifests, release replay, and integration.
  phase: FOCUSED_AND_BROAD_PASSED_RELEASE_ADVANCED_TO_SEPARATE_ASSERTIONS
  standards: IEEE 1800-2017/2023 section 9.2.2.2.1 always_comb implicit sensitivity; function-local written bits must not become external sensitivity.
  reproducer: evidence/caliptra-aes-timezero-20260923/automatic_local.sv and results.json; two automatic-function callers with bitwise local writes spin at time zero in both editions, while one caller and a whole-vector-write pair pass.
