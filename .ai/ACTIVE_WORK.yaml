lanes:
  - id: L106-CONSTANT-LOCAL-ARRAY-PATTERN
    agent: /root/constraint_abi
    status: AUTHORIZED
    standards: IEEE1800-2017 and2023 10.9,13.4.3
    reproducer: evidence/batch-20260915-after-l95/next-const-string-array-initializer-assessment/assessment.md
    actual: Both editions crash during constant evaluation of mutable, const and static-function local fixed-string-array aggregate initializers; runtime and separate element assignments pass.
    expected: Evaluate each compatible local fixed-array assignment-pattern leaf into the correct local slot, preserving array shape, type conversions and frame lifetime.
    root_cause: NetAssign::eval_func_lval_ dereferences a missing word selector when a whole-array NetEArrayPattern assignment reaches the local array path.
    owns: [net_func_eval.cc]
    test_prefix: sv_const_local_array_pattern
    dependencies: Existing pattern flattening, LocalVar array storage and slot conversion; no assertion-lane dependency.
    scope: Whole local fixed-array assignment patterns through the existing evaluator; cover declaration initialization and equivalent whole-array assignment where supported. No dynamic/queue representation, parser or target edits; report broader requirements before editing.
    acceptance: Paired constant/runtime string and integral arrays, exact element order and nonzero/ascending/descending bounds, signed/width conversions, repeated automatic/recursive frames, const initializer legality and readonly mutation rejection, positional and already-supported keyed/default pattern boundaries, malformed shape/type negatives, unchanged selected-element stores and L99/L101 neighbors.
  - id: L107-FINITE-FIRST-MATCH-MULTICLOCK-PREFIX
    agent: /root/constraint_wide
    status: AUTHORIZED
    standards: IEEE1800-2017 and2023 16.9.8,16.13.1,16.13.2
    reproducer: evidence/batch-20260915-after-l95/next-finite-sva-assessment/assessment.md
    actual: Both editions reject first_match(a ##[1:2] b) as a finite first-clock prefix; ordinary ranged-prefix support exists.
    expected: Retain earliest source endpoint; a child failure at35 cannot be rescued by a later source endpoint whose child would pass at55.
    root_cause: Parser fm metadata reaches bounded multiclock NFA admission, which explicitly rejects it; source attempt lacks first-accept cut handling.
    owns: [pform.cc, pform_sva_nfa.cc, pform_sva_nfa.h]
    test_prefix: sv_assert_multiclock_first_match_prefix
    dependencies: Existing finite source NFA, MATCH/CLOSE lifecycle and L103 parent aggregation. Independent of constant evaluation.
    scope: Direct Boolean first_match first-clock chains with one finite delay window, including exact-window boundary; reuse earliest-endpoint source closure without new scheduler/destination machinery. Do not accept broader nested/wrapper/match-item forms without proving preserved cut scope; diagnose unsupported forms explicitly.
    acceptance: Both editions earliest failure versus later would-pass endpoint, earliest success, no endpoint, exact/ranged windows, plain and implication use, ##0/##1 and reversed event order, overlapping attempts, cover once, Off/Kill/async disable/restart, destination backlog, construction/unsupported negatives and preserved ordinary L100/L102/L103 aggregation. Honor all earliest same-tick matches; do not claim Boolean-only merged paths are observably different without proof.
file_conflict_policy: Disjoint source and fixture ownership. No agent commits, shared build/install or shared harnesses. Report source freeze and do not edit again until coordinator releases it.
