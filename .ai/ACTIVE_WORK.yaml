status: focused_integrated_pr_preparation
branch: agent/ot-scope-queue-assoc-pop-20260923
baseline: main 7943dffd1 (PR340 and PR341 merged after exact-head CI successes); this branch is stacked on PR341 source head 5937223f2.
blocker: OT-SPI-STD-RANDOMIZE-QUEUE and ASSOC-QUEUE-POP-STATEMENT
goal: Advance unchanged released OpenTitan SPI Device and reject an invalid associative-array queue method without a simulator crash.
standards: IEEE 1800-2017 and 1800-2023 sections 18.12 and 7.10/7.9.
failing_reproducer: evidence/ot-spi-std-randomize-queue-20260923/reducer.sv fails elaboration in both editions; evidence/assoc-queue-pop-statement-20260923/reducer.sv compiles but vvp exits 139 on the current local build.
expected: Scope-randomize a direct local integral queue with exact size/element constraints and success-only writeback; reject queue-only pop/push/insert methods on associative arrays at compile time.
root_cause: Scope std::randomize currently admits scalar destinations only; statement-position method dispatch treats associative storage as a queue. A follow-on direct probe shows push_front/push_back/insert share the same invalid dispatch as pop_front/pop_back.
allowed_scope: Associative-array statement-method lane is committed at d0560368e and released elaborate.cc ownership; the scope-queue lane is re-scoped to the exact-size solver adapter below. Coordinator owns manifests, shared build/install, pinned release replay, integration and review.
forbidden: Verilator implementation changes, edits to pinned OpenTitan/Caliptra sources, unrelated compiler mechanisms, fallback success, or application DV pass claims from compile alone.
validation: Both selected reducers were RED before fixes. Associative statement focus passed 4/4 in each runner; scope queue focus passed 4/4 in each runner, neighboring JSON tests 29/29, and legacy context tests 11/11. PR340 and PR341 merged after one exact-head CI success each. Full DV and broad qualification remain pending.
