expected_behavior: "A VPI-lvalue write (e.g. $value$plusargs) to a string class property reached through another class-typed property (obj.inner.s) must reach the actual inner field, per IEEE1800 clause38.15 (vpiStringVal write) -- same as the already-working direct case (obj.s)."
root_cause: "ivl_expr_signal() on an IVL_EX_PROPERTY node is a shortcut elaboration takes only for a non-chained property access; once a property access is itself the BASE of a further property access, elaboration builds the intermediate node through the generic base-expression path (ivl_expr_oper2()) instead, even when that base is in fact a plain signal. tgt-vvp/draw_vpi.c's old fast path (get_vpi_taskfunc_signal_arg) required ivl_expr_signal(expr) directly, so any chain longer than one hop fell back to draw_eval_string (rvalue-only, discarded after the call)."
fix_summary: "tgt-vvp/draw_vpi.c: new collect_property_chain_() walks an arbitrary-depth string-property chain to its root signal (terminates at either the direct-signal shortcut or a plain-signal oper2 base; rejects any array-indexed hop). Emits variable-arity &CPS<vSIG_0,idx0,idx1,...>. vvp/parse.y: K_CPS production takes the existing `numbers` list nonterminal (zero new grammar conflicts, bison-table-diffed against baseline). vvp/vpi_cobject.cc: __vpiClassPropertyStringVar holds a property-index PATH; walks intermediate object hops via vvp_cobject::get_object() at each access; a null handle mid-chain on WRITE reports loudly (vvp error) instead of silently dropping."
scope: "String class properties only (IVL_VT_STRING leaf). Integral (vec4/CPV) nested properties, array-indexed hops, and virtual/polymorphic dispatch are explicitly out of scope and remain a follow-on -- see BLOCKERS.md L33 for the full statement."
