  root: evidence/review-20260920/spi-external-cfg-constraint-next/build1
  result: Build/install pass; exact external cfg and virtual-after-pre pass; null/X reject with rollback; impure/direction diagnostics correct; input/const-ref pass.
  still_open: Target/self calls, staged random arguments and wide capture support remain open.
  current_action: Build3 static qualifier correction passes both editions; target/self receiver assessment next. No broad qualification started.

build2_evidence:
  root: evidence/review-20260920/spi-external-cfg-constraint-next/build2
  result: Build retry/install pass; external caller, virtual after pre, null/X rollback, input/const-ref, signed8, unsigned64 and dist singleton pass in both editions. Invalid directions and 65-bit results diagnose.
  failure: Static-through-null constraint falsely fails X/Z; ordinary call control returns6. ABI implicit-this port exists for static methods, so guard must consult semantic static qualifier.
  application: Pristine M6 SPI compile now exits3; external cfg method diagnostic removed. Two queue element-equivalence errors and nested-struct constraint path remain; no DV qualification.
  application_record: evidence/review-20260920/spi-external-cfg-constraint-next/application-build2/result.json

build3_evidence:
  root: evidence/review-20260920/spi-external-cfg-constraint-next/build3
  result: Build/install pass. All 22 supported positive/rollback executions pass; 10 expected negative diagnostic cases verified. Six target/self/collision cases remain unsupported, not counted as passes.
  static_fix: Consult semantic static method qualifier before applying nonstatic null receiver guard; ABI receiver presence alone is insufficient.
  next: Authorized target receiver implementation underway; retain build3 as last validated external phase.
  pending: Permanent regressions, remaining ticket semantics, mapped and broad qualification, publication.

target_receiver_phase_authorized:
  invariant: Evaluate randomize receiver exactly once and retain the same object across pre_randomize, function capture, solving and post_randomize, including caller-handle changes.
  root: No existing NetExpr denotes the retained object stack receiver. Reusing obj_expr in a wrapper call would evaluate it again and can bind a different object.
  scope_expansion_reason: Target/self functions require class lexical lookup with actual retained randomized receiver; caller lexical scalar capture is insufficient.
  implementation_owner: inline_target_capture Terra/medium (replacement after prior worker exhausted context)
  authorized_additions:
  - elaborate.cc and elab_expr.cc reuse existing class-scope function wrapper construction through a per-inline prebuilt scalar slot channel with ownership and rollback.
  - tgt-vvp/eval_vec4.c recognizes private target-capture slot metadata only within randomize-with lowering.
  - tgt-vvp/draw_ufunc.c and vvp_priv.h small helper extends existing function preamble to bind first formal from an alias of the retained receiver, never re-evaluating original receiver.
  constraints:
  - No new runtime opcode or per-class inline registration; no mutation of class constraints for one call site.
  - Preserve null/X rejection, purity, virtual dispatch, widths and post-pre ordering.
  - Begin target/self state-only zero-argument calls; staged random inputs remain in-ticket and unsupported until correctly ordered.
  acceptance: Existing self_cfg/self_method/collision cases, derived target virtual-after-pre, nested null rollback, receiver-once and pre-rebind tests, all existing external cases and class-function neighbors.

target_red_harness:
  command: python3 evidence/review-20260920/spi-external-cfg-constraint-next/run_targets.py build3
  result: Eight paired class-control executions pass. Target inline cases fail before implementation; function-call receiver inline syntax is separately recorded parser debt.
  receiver_once: coordinator/target_index_once.sv has side-effecting index evaluated once; pre-rebind control changes caller current handle but solves original object.

build4_evidence:
  root: evidence/review-20260920/spi-external-cfg-constraint-next/build4
  result: Build retry/install passed; self and target-owned methods, local/target collisions, virtual target, null rollback, retained object after pre-rebind and index-once pass both editions. All external phase positives and negatives remain correct.
  neighbors: 212/212 function regressions in each legacy and JSON runner, zero failures.
  provenance: Expanded fingerprints include all seven changed compiler/runtime/target files and installed tools; source.patch freezes the exact source delta from2224ec805.
  remaining: Random-dependent argument staging, wider results and broader qualification remain open; parser function-call receiver gap separately parked.
  next: Permanent retained-target regression families integrated and focused-tested. Implement and review staged random-argument path, then broader qualification.

inline_random_argument_phase_authorized:
  standards: IEEE 1800-2017 18.5.12 and IEEE 1800-2023 18.5.11. Function arguments referencing random variables establish priority partitions, unlike solve-before; calls execute before their dependent constraints and return state.
  red: evidence/review-20260920/spi-external-cfg-constraint-next/staged/build4-red.json; paired class-body control passes23,41,255 in both editions, actual inline target x==f(y) currently rejects.
  root: vvp_z3_plan_function_stages attaches class capture calls only when class_ir=true; extra_ir has no per-call descriptors. Eager fv captures would sample y before it is solved.
  expanded_scope: Per-randomize-call inline capture descriptors must travel with extra_ir through compiler target emission, vvp/vthread.cc randomize_solve_options_s/session, vvp/vvp_z3.h object and plan structures, and vvp/vvp_z3.cc planner. They are not class-type metadata. Class-call path must remain intact.
  acceptance:
  - Paired inline target and caller random-argument reducers across 2017/2023 with distinct repeated actual values and width boundary.
  - Random argument priority partitions, null/X rollback, active selection and pre/post hook behavior preserved.
  - Receiver identity preserved through staged continuation; caller lexical frame lifetime proven.
  - Existing external/target state-only and 212 neighboring function regressions pass.
  restrictions: Do not early evaluate random actuals, fabricate known outputs, mutate class-wide descriptors for a callsite, or weaken unsupported diagnostics.
  implementation_lane: Retained Terra inline_target_capture; first trace exact serialization and call frame linkage, then implement smallest complete staged path with coordinator review at any new boundary. No agent shared builds/tests.

