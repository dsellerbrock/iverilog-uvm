  - PCallTask indexed-path receiver classification and hierarchical lookup routing
  - Focused positive and negative tests, registrations, gold, evidence and ACTIVE_WORK
forbidden_scope:
  - General class, object, interface, deferred or compile-progress fallback redesign
  - Dynamic selection of module or generate instances
  - Broad suites before the tenth-feature batch checkpoint
