id: L46
title: Fixed-prefix packed indexed subpart reads retain element bounds
status: IMPLEMENTED_FOCUSED_PASS
base_revision: 67b6750af
origin: DD-022
standards:
  - IEEE 1800-2017 11.5.1
  - IEEE 1800-2023 11.5.1
reproducer: evidence/dynamic-mixed-driver-assessment/subpart_read_bounds.sv
current_behavior: A final indexed part select after valid fixed packed-prefix indices is flattened onto the complete signal, so reads can leak into a sibling packed element. VVP also truncates arbitrary-width packed-select bases to 32 bits.
expected_behavior: The selected packed element bounds the read. Out-of-range result bits are X, valid overlapping bits retain their result positions, and the index is evaluated once.
root_cause: normalize_variable_part_base adds the fixed element's canonical offset before NetESelect loses the element boundary; VVP %part and %parti narrow select bases through signed int32 arithmetic.
allowed_scope:
  - elab_expr.cc final indexed +:/-: reads after valid fixed packed-prefix indices
  - vvp/vthread.cc shared exact or saturating packed and queue slice base conversion and overflow-safe read clipping
  - Focused read-boundary regressions, manifests, gold, evidence, and ACTIVE_WORK
forbidden_scope:
  - Blocking, compound, or nonblocking l-value boundary semantics
  - Dynamic mixed-driver enablement
  - Invalid fixed-prefix index validation
  - Broad packed-select or l-value IR redesign
completion_requirements:
  - Wholly out-of-range and partial-overlap reads for +: and -: preserve element boundaries
  - Descending, ascending, nonzero and multiple valid fixed-prefix dimensions pass
  - Dynamic index evaluation occurs once; X/Z, signed negative, unsigned 32-bit, 64-bit and 128-bit bases are handled without integer overflow
  - Existing multidimensional subarray +: selection remains green
  - Focused legacy and JSON regressions plus null-target and synthesis smoke pass in 2017 and 2023
  - Durable logs with exit status; broad suites deferred to the campaign batch boundary
validation_batch: 20260914
focused_features_before_this: 3
last_validated_revision: Working tree after incremental rebuild/install. Original read reproducer passes in 2017 and 2023. Focused legacy 1/1 and JSON 2/2 pass. Null-target and synthesis smoke pass in both editions; the existing invalid variable-bound source is rejected in both. Nonconstant carriers avoid a needless host-width conversion during constant folding. The installed runtime uses exact/saturating int64 conversion for arbitrary-width dynamic bases and overflow-safe clipping.
pending_gates: Campaign batch gates; broad suites deferred until batch boundary.
next_action: Root completed negative checks both editions, L44 neighbors4/4 and review; checkpoint L46. DD-022 l-value writes and DD-021 dynamic mixed-driver support remain open.
evidence: evidence/dynamic-mixed-driver-assessment/final-l46-focus-{legacy,json}.log, final-l46-null-synth.log and final-l46-negative.log
discovery_policy: Invalid preceding packed-prefix indices and the preexisting one-dimensional constant 2^32 elaboration alias remain separately tracked; neither is claimed fixed here.
stop_after_completion: false
