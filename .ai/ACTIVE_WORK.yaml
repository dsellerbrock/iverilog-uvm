l09_reducer: ../evidence/campaign-20260908/l09/output_actual.sv; both2017/2023 compile0/run1,caller seen remains-1 instead of37. Non-nested output_actual_control.sv passes both modes. No warnings after separate object initialization.
l09_standards: Both IEEE1800-2017 and2023 clause13.5 require output/inout values returned to corresponding actual variables; clause8.6 gives automatic class-method lifetime. Read local editions.
l09_trace: Bytecode stores produced37 into recurse.seen before freeing produce, while recurse callee is staged on write head. of_STORE_VEC4 passes ensure_write_context_ to vvp_send_vec4; actual scalar path does not call scoped-write accessor. Follow automatic receive recovery before choosing repair.

l09_indexed_reducer: ../evidence/campaign-20260908/l09/indexed_output.sv; both editions compile0/run1. Recursive output to slots[choose(index)] uses callee index0 instead of caller index1, producing37,-1 rather than-1,37.
l09_review_direction: Independent diagnosis rejects global returned-window write redirection because fixed-array return materialization legitimately writes staged storage before epilogue. A write-only copy-out binding also leaves same-scope index and receiver reads wrong. Separate formal-source reads from caller read/write destination evaluation; nested address calls must inherit caller context.
l09_trace_evidence: output_actual.trace shows produced37 delivered to staged recurse frame, then overwritten by its local initialization; original caller frame retains-1. Existing per-type copy-out emitter has explicit formal load sites, suitable for source/caller phase separation without replacing copy semantics.
