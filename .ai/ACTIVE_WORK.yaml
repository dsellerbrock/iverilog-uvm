expected: Names resolve target-first, then caller scope. A caller object's method is called before solving and its value is a state constant (virtual dispatch through the runtime handle). Unsatisfiable results fail and keep the previous values.
root: Hypothesis - CONSTRAINT-OBJECT-METHOD-RECEIVER added state object-method capture for class constraints only ("scope object calls not expanded"); the inline caller-scope operand path does not route method calls through that capture.
allowed_files:
