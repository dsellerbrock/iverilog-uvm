non_goals: ["Did not touch property_bit (2-state bit vectors) -- confirmed already correct before this fix, no change needed.", "Did not touch property_string (actual string-typed properties) -- already correct.", "Did not add any new X/Z-specific handling -- the shared conversion already treats X/Z as 0, matching the pre-existing plain-variable behavior, verified not to crash."]
