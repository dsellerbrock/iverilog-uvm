discovery_policy: "First hypothesis (from the L40-era DISCOVERED_DEBT.md entry) guessed this needed a 'property_vec4-style get_string override doing the itoa conversion' -- i.e. decimal formatting. Verified against the LRM directly before implementing anything: 6.16 defines integral-to-string as byte-PACKING, not decimal formatting (confirmed empirically too: a plain int variable with value 42 already converts to the 1-character string '*', not '42'). Implementing the wrong (itoa) conversion would have been a second, different-shaped bug; tracing the actual existing plain-variable opcode (%pushv/str) before writing any new code avoided that."
