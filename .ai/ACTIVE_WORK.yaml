goal: Resolve a module's default clocking for concurrent assertions that appear earlier in the same module, without changing procedural clock inference or accepting truly unclocked assertions.
standards: IEEE 1800-2017 and IEEE 1800-2023 sections 14.12 and 16.14.6; the default clocking applies within its containing module scope.
failing_reproducer: evidence/caliptra-next-after-named-20260923/late_default_clocking.sv fails in both editions. Clean pinned Caliptra v2.1.2 fv_ecc_dsa_sequencer.sv lines 91-95 precede default clocking at line 97 and yield five false missing-clock errors. Exact commands and controls are in evidence/caliptra-next-after-named-20260923/result.json.
expected: Late and early default-clock declarations provide the same assertion clock within the module. No-default and unresolved-reference cases retain diagnostics; procedural enclosing-event inference and nested-module scope remain correct. Verify actual checker execution, not compilation alone.
root_cause_hypothesis: pform_make_assertion parks unclocked assertions before the later declaration, but pform_endmodule pops the module and pform_sva_flush_pending_procedural unconditionally rejects the parked assertions instead of retrying them while the module default clock remains in scope.
