scope_expansion_rationale: The one-line PNoop-to-nullptr fix made the existing statement_item grammar accept imports wherever any statement is legal, although IEEE 1800 permits them only in a block/task/function declaration prefix. It also exposed statement's unconditional attribute binding through a null declaration result. Placement enforcement and attributed-import coverage are therefore prerequisites of the root fix, not unrelated cleanup.
