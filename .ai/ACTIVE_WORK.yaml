standards:
  - IEEE1800-2017 and IEEE1800-2023 19.7.1 Table19-3 and19.11.3.
expected_behavior: Declared coverpoint/cross type_option.weight defaults to1 independently of option.weight and weights merged item coverage; ordinary instance and merge_instances0 calculations retain their instance weights.
observed_behavior: A50-percent and B0-percent with type weights3/1 and instance weights1/3 return12.5percent for both type and instance, where merged type must37.5percent. Both editions reproduce on validated59d8f345a.
reproducer: ../evidence/campaign-20260908/v06/type-weight.sv
selection_reason: Explicit residual after V03 and V05; incorrect weights distort routine coverage completion reports even with correct bin counts. This is a direct remaining standard obligation, not a broad audit or selection by ease.
allowed_scope:
  - Declared integral constant type-weight validation and propagation for coverpoints and crosses through existing class IR, target metadata and runtime merged aggregation.
  - Preserve older VVP metadata compatibility and validate new metadata; reuse existing group type-weight mechanisms where appropriate.
  - Paired permanent weight/default/zero/mode/constructor interaction and invalid-value controls; correct existing item-isolation fixtures to declare both type and instance weights, with standards-based evidence rather than weakening their bin assertions.
non_goals:
  - Procedural static type-option assignment, goals/strobe, unsupported topology or transition cardinality redesign.
  - No application edits, formal architecture changes or unrelated cleanup.
invariants:
  - Type and instance weights remain independent; group weights do not become lower-level defaults.
  - No silent acceptance of nonconstant, negative, unknown or otherwise unrepresentable new type-weight metadata.
  - Preserve merge_instances0 weighted-instance semantics, bin identity/count/threshold logic and older bytecode readability.
required_gates:
  - Primary2017 and2023 Table19-3 plus19.11.3, paired baseline failure, causal source trace and independent design review of metadata extension.
  - Paired permanent positive/negative/default/mode controls and malformed/legacy metadata checks; coverage neighbors and V04/V05 regression controls.
  - Integrated,VPI,negative,runtime,NFA,fullJSON,real-DPIUVM,makecheck and independent final review; remote CI before separately authorized merge.
completion: Close exact declaration-time item type-weight scope only after all required local gates and review pass; other parentV01 and type-option obligations remain open.
stop_after_completion: false
discovery_policy: Unrelated discoveries record-only; any proven prerequisite requires preserved parent work and a deliberate coordination boundary.
next_action: Trace existing group type-weight validation/metadata and item aggregation; choose the smallest complete metadata extension with backward compatibility before source edits.
