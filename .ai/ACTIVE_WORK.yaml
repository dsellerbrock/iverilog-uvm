reproducer: evidence/dd018-assessment/function_second_valid.sv
current_behavior: Internal elaboration error for PNoop after int declaration followed by import.
expected_behavior: Resolve imported types and values in the local scope, execute the body, emit no executable operation for the import declaration.
root_cause: The existing statement_item import production creates PNoop, which inherits Statement::elaborate and emits an internal error. Imports already take effect during parsing via pform_package_import.
