id: L03
title: Preserve automatic activation identity in Boolean event expressions
status: in_progress
phase: design_after_prerequisite
base_revision: 755b48a09920bced3832409b1548c8437c884976833c052cc3b5b80e7e03aacbc2c05aa
standards:
  - IEEE1800-2017 and IEEE1800-2023 6.21 and9.4.2; verify exact expression event and automatic lifetime rules before implementation.
expected_behavior: Concurrent automatic task invocations observe transitions of their own Boolean event expression, not another invocation's operand.
observed_behavior: Retained DD-003 reducer posedge(value[2] | 1'b0) fires both invocations at time2 instead of times2,3; reverify on current validated source.
reproducer: ../evidence/campaign-20260908/u01-loop/history-expression-preexisting.sv
selection_reason: Shared automatic Boolean driver state can corrupt ordinary concurrent DV event waits; concrete pre-existing reducer and prior L02 mechanism give a justified next blocker beyond SVA composition.
allowed_scope:
  - Shared Boolean expression event driver automatic-context preservation and directly necessary compile/lowering selection.
  - Existing runtime automatic activation mechanisms, without a new scheduler architecture.
  - Permanent paired regressions and required focused/full validation, review and conformance records.
non_goals:
  - No unrelated default-negedge DD-004, foreach type DD-002, application teardown changes or formal architecture work.
invariants:
  - Each activation has its own operand state and event history; propagate source activation identity through the actual expression computation.
  - Preserve scheduler-region ordering, reset/free lifetime hooks, static scope behavior and cancellation.
  - Preserve unrelated worktrees and required toolchain/permission gates.
required_gates:
  - Fresh paired red reducer plus direct-signal and Boolean-expression controls; standards and causal trace before patch.
  - Permanent concurrent activation, expression polarity, lifetime and static controls.
  - Focused legacy/JSON, relevant lifetime neighbors,NFA,integrated,VPI,negative,runtime,fullJSON,real-DPIUVM,makecheck and independent review.
  - Remote CI required before merge.
completion: Qualify only the exact repaired automatic Boolean event-expression scope; broader event operators and application/formal status remain separate.
discovery_policy: Unrelated findings record-only; proven prerequisites require a deliberate boundary with preserved reducer and work.
stop_after_completion: false
last_validated_revision: 755b48a09920bced3832409b1548c8437c884976833c052cc3b5b80e7e03aacbc2c05aa
next_action: Reproduce DD-003 on current tools; graph-guided trace of Boolean expression propagation and existing automatic functors.

causal_trace: Boolean operands and scheduled output are shared and source context is discarded. Mixed-scope expressions cannot publish a parent result to children with different local operands. Existing allocation/reset hooks run before stack linkage and do not publish unchanged defaults.
prerequisite: L04 validated in 755b48a09920bced3832409b1548c8437c884976 establishes post-link initialize_instance and integral default publication. Resume L03 with preserved original reducer.

next_design: Reuse frame-owned ancestor input history and post-link initialization to seed each child Boolean result; never broadcast a parent result over children with distinct local operands.
