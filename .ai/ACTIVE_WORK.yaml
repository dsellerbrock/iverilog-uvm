blocker: CALIPTRA-SVA-LONG-SEQUENCE-REGISTER-COLLISION
goal: Compile and execute legal finite SVA sequences with at least 1000 steps without colliding synthesized assertion registers.
standards: IEEE 1800-2017 and IEEE 1800-2023 section 16.7, finite sequence concatenation; confirm exact edition clauses before patching.
failing_reproducer: evidence/caliptra-pm-formal-elab-triage-20260923/long_sequence_1000.sv fails in both editions with duplicate _ivl_sva0_b999; the 999-step control compiles. The pinned clean Caliptra v2.1.2 fv_ecc_pm_sequencer.sv fails at lines 1898 and 2951 in its ECC filelist.
expected: Every generated assertion register has a unique name for any legal finite sequence length; the 1000-step property compiles and gives the correct sampled pass/fail actions at runtime.
root_cause: Before the fix, pform.cc reserved b999 for antecedent capture and also used b999 for consequent step index 999.
root_cause_hypothesis: The fixed numeric sentinel in pform_make_assertion shares the indexed consequent-register namespace; use a distinct stable name for the antecedent capture without changing checker timing.
