prior_pr: https://github.com/dsellerbrock/iverilog-uvm/pull/360
goal: Preserve acyclic dependencies between disjoint selected continuous assignments to one packed vector, so the pinned OTP arbiter mask tree settles to defined values and GrantKnown_A observes a real known grant when its request and ready inputs are known.
standards: IEEE 1800-2017 and IEEE 1800-2023 packed-select and continuous-assignment semantics; confirm precise clauses before claiming conformance. Preserve four-state behavior and strict multiple-driver rejection.
failing_reproducer: evidence/opentitan-otp-mask-tree-20260924/three.sv compiles under strict 2017/2023 but prints tree=zzz and fatals instead of 100; scalar control passes and overlapping-driver illegal control rejects in both editions. Pinned otp_ctrl_smoke_vseq is 0/1 released DV at 1559061 ps on GrantKnown_A in tb.dut.u_otp_arb.
expected: A root bit continuously driven to zero, a child bit driven from that root, and a leaf bit driven from the child OR one must settle to 3'b100. Other acyclic disjoint packed-bit drivers retain exact dependency and four-state propagation. An overlapping continuous drive on the same variable bit remains illegal; a genuine combinational cycle must not be hidden by a fabricated constant.
root_cause_hypothesis: The pinned and minimal emitted VVP images contain a .part read of the full packed tree feeding the same tree's .concat8. The whole-vector feedback leaves the tree Z despite an acyclic source bit graph. Trace elaboration, netlist optimization, and target input construction to identify the first wrong representation before changing source; the owning function is not yet proven.
allowed_scope: Only the shared packed-vector selected continuous-driver construction or VVP target lowering path implicated by the paired RED, plus dedicated 2017/2023 legal, overlap, and true-cycle tests and required manifests. Coordinator owns private builds, focused and broad gates, pinned OTP replay with all assertions and native DPI, evidence, docs, review, and a separate PR. No installed Caliptra binaries, pinned application sources, Caliptra code/evidence, vvp/vvp_z3.cc, Verilator, GPU, or CI polling. Widen to VVP runtime only after a recorded source-level proof that existing target lowering cannot preserve the bit DAG.
current_result: Selected with paired strict 2017/2023 legal RED 2/2 failed runtime, scalar controls 2/2 passed, and overlapping-driver controls 2/2 correctly rejected. Copied-image probe identifies u_otp_arb req_i=00011111111111 ready_i=1 gnt_o=000xxxxxxxxxxx and mask_tree all Z; exact owning compiler stage remains unproven. Pinned OTP remains 0/1 released DV; parked CSRNG remains 0/1 on its distinct nested-VIF value handoff. Evidence is evidence/opentitan-otp-mask-tree-20260924/paired_red_result.json.
acceptance: Prove the first wrong compiler representation; retain paired 2017/2023 legal disjoint-bit DAG RED, scalar, overlapping-driver, and genuine-cycle controls; fix the smallest shared root; run focused/neighbor gates and required broad legacy, JSON, and real-DPI UVM gates; replay pinned OTP without disabling assertions/checks and count only completed meaningful checked runtime with zero errors/fatals as released DV.
stop_after_completion: Publish this blocker as one PR, then return to coordinator selection. Keep CSRNG nested-VIF and any later OTP failures as separate tickets.
