  owner: eval_evidence_audit Luna/low
  files: evidence/review-20260920/spi-external-cfg-constraint-next/direction-fixtures only
  task: Mechanical input/const-ref positives and output/inout/nonconst-ref negatives; coordinator reviews semantics before scoring.

