id: L01
title: Preserve selected-prefix identifiers in procedural member foreach
status: in_progress
phase: trace_implementation
base_revision: c57fbe3c5
parent: U01
standards:
  - IEEE 1800-2017 and IEEE 1800-2023 12.7.3 and Annex A.6.8/A.9.3 (terminal loop-variable list and selected target).
expected_behavior: In foreach(devices[selected].ranges[j]), selected resolves in the enclosing scope and only j is declared/iterated by this loop.
observed_behavior: The bare-identifier grammar alternative declares a new selected loop variable and traverses every outer device. The two-device lookup admits 0x2309 into the 0..0x1ff device.
reproducer: ../evidence/campaign-20260908/u01/lookup.sv (both editions fail; Slang accepts both, Verilator runtime passes).
causal_mechanism: parse.y hierarchical loop_variables alternative synthesizes nested outer and inner PForeach nodes, unlike the existing expression-prefix alternative.
allowed_scope:
  - parse.y (selected member foreach action only)
  - ivtest (permanent selected-prefix regression and correction of false dual-loop expectation)
  - .ai/ACTIVE_WORK.yaml
  - .ai/CAMPAIGN.yaml
  - docs/conformance/BLOCKERS.md
  - docs/conformance/matrices/ieee1800_2017_clause_matrix.md
  - docs/conformance/session_logs/2026-09-08_continuous_campaign.md
non_goals:
  - No unrelated foreach/constraint grammar redesign or new array type support.
  - No edits to the pinned OpenTitan corpus or its checking/traffic.
invariants:
  - Only terminal loop variables are local; preserve selected prefix lookup and capture semantics.
  - Preserve existing expression-prefix and ordinary multidimensional comma-list behavior.
  - Retain index typing, automatic scope lifetime, nested returns and bounds.
required_gates:
  - Both-edition selected prefix, constant prefix, nested member queues/arrays and ordinary foreach controls.
  - Bison conflict count/signature check; focused legacy and JSON regressions.
  - Integrated ivtest/VPI/negative/runtime, full JSON, real-DPI UVM, make check, independent review.
  - Replay U01 after local semantic gates pass; do not close U01 without checked application completion.
  - Remote CI before merge.
completion: Resolve only selected-prefix iteration defect after all required local semantic gates; then resume U01.
discovery_policy: Unrelated findings are record-only.
stop_after_completion: false
