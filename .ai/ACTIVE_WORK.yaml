id: V03
title: Honor covergroup type weight in overall coverage
status: in_progress
phase: bytecode_compatibility_repair
base_revision: ac60732f3
standards:
  - IEEE1800-2017 and IEEE1800-2023 19.7.1 table19-3, 19.9 and 19.11.
expected_behavior: Eligible covergroup types contribute to overall coverage according to type_option.weight; scores50 and100 with weights1 and3 produce87.5.
observed_behavior: Both editions produce75.0; type_option.weight is accepted but ignored by the overall arithmetic mean.
