    acceptance: Both editions late/early/no-match verdicts and exact times, ##0/##1 clock cutoff with reversed coincident process order, multi-tick prefixes, overlapping starts, cover action counts, Off/Kill/async disable/restart, paused destination backlog, finite depth and unsupported controls; preserve L100 implication quantifiers and fixed plain neighbors.
