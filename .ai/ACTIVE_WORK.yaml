id: L07
title: Implement queue-last element assignment without elaborator abort
status: in_progress
phase: selected
base_revision: c35d2ef36
last_validated_revision: c35d2ef36
standards: IEEE1800-2017 and IEEE1800-2023 7.10 and7.10.1.
selection_reason: Unmodified official UVM2020.3.2 now reaches msg_queue[$] assignment; DD013 reducer aborts before runtime on both previous baseline and current compiler.
expected_behavior: Dollar selects the current last queue element at lvalue evaluation; legal assignments update exactly that element. Preserve all other elements, bounds, type conversion, lifetime and assignment scheduling semantics.
allowed_scope:
  - Queue last-index lvalue dispatch and shared elaboration helpers; causal callers only.
  - Permanent paired regressions for types, lifetime, size changes, existing ordinary indices and supported member paths; expose empty/bounded behavior honestly.
  - Full standards/source trace, required local gates, independent review and official UVM2020.3.2 replay.
non_goals:
  - No blanket parser rewrite, duplicate evaluation, library edits, unrelated type/array redesign or broad queue qualification claim.
  - No suppression of diagnostics or silent success for unsupported legal shapes.
required_gates:
  - Paired baseline red and exact standards semantics; focused positive/negative/boundary regressions and affected neighbors.
  - Integrated ivtest,VPI,negative,runtime,fullJSON,NFA,real-DPI UVM,makecheck and independent review.
  - Official UVM2020.3.2 replay; progress is not a release pass.
suspended_work: B01 remote Windows correction at PR273/c189df5b8 remains awaiting CI; no merge authorization or waiver.
next_action: Reproduce on frozen validated tools, trace SEL_BIT_LAST lvalue consumers, then choose the smallest correct lowering change.
stop_after_completion: false
