id: L48
title: Preserve packed-dimension bounds and four-state prefixes in indexed reads
status: IMPLEMENTED_FOCUSED_PASS
base_revision: c3fb934fd
origin: DD-022
standards:
  - IEEE 1800-2017 11.5.1 and 11.5.2
  - IEEE 1800-2023 11.5.1 and 11.5.2
reproducer:
  - evidence/dynamic-mixed-driver-assessment/prefix-outside.sv
  - evidence/dynamic-mixed-driver-assessment/prefix-unknown.sv
current_behavior: A multidimensional packed indexed read flattens fixed prefixes through native long values, so an out-of-range or unknown middle prefix can alias a valid sibling element.
expected_behavior: Each packed dimension validates its own index and retains X/Z. Invalid four-state prefixes yield X, invalid two-state prefixes yield zero, and the final indexed base is evaluated once.
root_cause: Constant prefixes were converted to list<long> without per-dimension validation, while dynamic prefixes were collapsed into one flat offset. Both representations discarded the dimension boundary needed to prevent sibling aliasing.
allowed_scope:
  - Read-only packed prefix lowering for final indexed +:/-: selections
  - Pure packed signals and packed suffixes of fixed unpacked words
  - VVP evaluation of immediate X/Z select bases and two-state selected values
  - Focused positive/negative regressions, manifests, gold, evidence and ACTIVE_WORK
forbidden_scope:
  - Packed lvalue bounds or writes
  - Dynamic mixed-driver enablement
  - Short subarray or general packed-select redesign
  - Broad regression suites before the campaign batch boundary
completion_requirements:
  - Constant and dynamic outer/middle invalid and X/Z prefixes cannot alias siblings in 2017 or 2023
  - Valid prefixes, ascending/descending nonzero ranges, +:/-:, wide indices and fixed-unpacked-word suffixes pass
  - Prefix and final index side effects occur once even for an invalid prefix
  - Invalid two-state prefixes produce zero and four-state prefixes produce X
  - Real packed prefixes and variable indexed widths remain rejected
  - Focused legacy, JSON, null-target and synthesis checks pass; L46 neighbor remains green
validation_batch: 20260914
focused_features_before_this: 5
last_validated_revision: Working tree after incremental compiler and tgt-vvp rebuild/install. Focused legacy 2/2, JSON 4/4 and L46 JSON neighbor 2/2 pass. Null-target and synthesis checks pass in both editions; variable-width negative rejects with exit 4.
pending_gates: Root review/checkpoint and campaign batch gates. An accidental partial broad legacy invocation was terminated with exit 143; root observed sv_rand_distribution1 mismatch, so it qualifies no gate and requires fresh batch assessment.
next_action: Root reviews and checkpoints L48. DD-022 packed writes and DD-021 dynamic mixed-driver support remain open.
