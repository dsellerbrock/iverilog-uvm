  l85: "A retained complete-range guard evaluated after a prefix draw can cause seed-dependent unsupported rejection. Prove every reachable prefix before sampling or implement exact conditional range behavior; no success-conditioned sampling."
  l86: "IEEE 16.12.7 and 16.14.1 require a single property-attempt verdict across sibling antecedent endpoints. Scalar request counts lose parent identity. A parent with two matches and one failed child must dispatch pass=0/fail=1. Dynamic parent-tagged transport and retirement are necessary because a paused destination clock leaves an unbounded backlog even with a finite antecedent. Architecture expansion is coordinator-authorized; fixed-path cloning is incorrect."
