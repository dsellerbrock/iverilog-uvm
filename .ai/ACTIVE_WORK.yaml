  focus: evidence/review-20260920/spi-external-cfg-constraint-next/build4/permanent/results.json (legacy8/8,JSON8/8).
  review: Initial Luna draft had wrong null expectation and missing PASS markers; archived under evidence/review-20260920/spi-external-cfg-constraint-next/permanent-draft-invalid. Coordinator corrected to tested runtime diagnostic and passing assertions before registration.

