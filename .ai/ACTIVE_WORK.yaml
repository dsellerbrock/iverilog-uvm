id: V05
title: Include automatic cross-bin identities in merged type coverage
status: in_progress
phase: reproduced
base_revision: 27c1672d6
standards:
  - IEEE1800-2017 and IEEE1800-2023 19.6 and19.11.3; verify exact cross-bin name identity and merged count semantics.
expected_behavior: Merged type coverage counts the union of automatic cross-bin names across instances, with correctly merged hits and thresholds; constructor-dependent bin products must not collide through local ordinal numbering.
observed_behavior: Two constructor-dependent cross instances contribute six distinct product bins and two hits but return0.0 merged type coverage; instance coverage correctly returns25.0 for its four-bin domain. Both editions reproduce on validated27c1672d6.
reproducer: ../evidence/campaign-20260908/v05/cross.sv
selection_reason: Existing parent V01 still leaves automatic cross-bin union unqualified. Cross coverage is routine DV checking, and omission makes type-level completion/progress reports wrong despite correct per-instance checking.
allowed_scope:
  - Runtime automatic cross-bin registration, canonical identity/hit mapping and merged type coverage aggregation, with directly necessary existing metadata/state support.
  - Permanent paired identity/union/threshold/lifetime controls, focused neighbors, required full gates, review and exact records.
non_goals:
  - No new parser grammar, expanded domain limits, transition-family cardinality repair, named-bin redesign or unrelated coverage options.
  - No application changes, broad audit, formal architecture changes or immediate new PR.
invariants:
  - Use full cross-product bin-name identity; never merge different bins merely because their per-instance ordinals match.
  - Preserve instance topology, sampling guards, ignore/illegal/named-bin precedence, retention behavior, thresholds, weights, retirement and existing explicit domain boundaries.
required_gates:
  - Paired failing reducer and applicable primary LRM before implementation.
  - Actual source/metadata/runtime trace and bounded independent design review if shared identity representation changes.
  - Paired permanent union/identity controls; full coverage neighbors, integrated,VPI,negative,runtime,NFA,JSON,real-DPIUVM,makecheck and final independent review.
  - Remote CI before separately authorized merge.
completion: Qualify exact automatic cross union/identity scope supported by reviewed evidence; parent V01 and other residual coverage obligations remain separate.
discovery_policy: Unrelated findings record-only; proven prerequisite requires deliberate suspension with preserved reducer/work.
stop_after_completion: false
last_validated_revision: 27c1672d6
next_action: Trace constructed cross choices/routes and shared count updates, verify primary bin-name semantics, then choose the smallest correct reuse of existing registration/counter machinery.
