failing_reproducer: evidence/caliptra-next-after-named-20260923/late_default_clocking.sv fails in both editions. Clean pinned Caliptra v2.1.2 fv_ecc_dsa_sequencer.sv lines 91-95 precede default clocking at line 97 and yield five false missing-clock errors. Exact commands and controls are in evidence/caliptra-next-after-named-20260923/result.json.
