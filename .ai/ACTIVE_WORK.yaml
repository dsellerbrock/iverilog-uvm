parallel_adc_typed_fill_lane:
  id: OT-ADC-DIRECT-CAST-WIDTH
  owner: Reused lower-cost implementation agent; coordinator owns shared build, install, manifests, integration, and review.
  standards: "IEEE 1800-2017/2023 sections 5.7.1, 6.24.1, and 18.5: an unbased fill literal in a sized type cast fills the cast destination before constraint equality."
  reproducer: evidence/opentitan-adc-cast-width-triage-20260923/cast_width_repro.sv, cast_width_controls.sv, and cast_width_unsat_control.sv reproduce wrong 16/17-bit fills in both editions on the current installed compiler.
  files: elaborate.cc constraint IR and vvp/vvp_z3.cc cast/fill solver path as required; dedicated constraint ivtest fixtures only. No elab_expr.cc queue-size edits, VPI, pinned application sources, shared manifests, or build outputs.
  acceptance: Typed 16- and 17-bit unbased '1 constraints solve to all-ones before equality; 1-bit and sized 1'b1 controls remain 1; 'x/'z four-state direct cast controls stay exact; compatible and contradictory combined constraints behave correctly; paired editions and neighboring constraint regressions pass. No ADC DV claim from reducer.
  state: Committed at 5afbe4c7f; direct unbased-fill cast checks pass in both editions and runners with explicit unsupported boundaries. Full local gate passes; indexed ADC inner sizing and PR339 merged after Ubuntu 24.04 exact-head CI success; other CI jobs remained observable at merge.
