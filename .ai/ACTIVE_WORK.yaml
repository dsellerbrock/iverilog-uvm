id: L49
title: Bound packed indexed writes to their fixed-prefix carrier
status: FOCUSED_VALIDATED
base_revision: d28149794
origin: DD-022
standards:
  - IEEE 1800-2017 11.5.1 and 11.5.2
  - IEEE 1800-2023 11.5.1 and 11.5.2
reproducer:
  - evidence/dynamic-mixed-driver-assessment/write-blocking.sv
  - evidence/dynamic-mixed-driver-assessment/write-compound.sv
  - evidence/dynamic-mixed-driver-assessment/write-nonblocking.sv
current_behavior: A final indexed write with a fixed packed prefix uses one flattened signal offset, so partial overlap escapes the selected element and overwrites a sibling.
expected_behavior: Blocking, compound and nonblocking writes clip only against the fixed-prefix carrier. Partial overlap updates valid carrier bits; wholly out-of-range or X/Z bases do no write; indices evaluate once.
representation_invariant: NetAssign_ retains the existing absolute canonical part base plus a constant canonical carrier offset and width. Only defined in-range fixed prefixes receive metadata. Targets subtract the carrier offset for clipping, then store the surviving slice at its absolute signal offset.
allowed_scope:
  - NetAssign_ carrier metadata, duplication, target transport and analysis
  - Fixed valid packed prefixes with final indexed +:/-: writes
  - Blocking, compound and NBA signal and packed array-word stores
  - VVP runtime clipping via resize_rval_vec and synthesis bounded lowering
  - Focused tests, manifests, gold, evidence and ACTIVE_WORK
forbidden_scope:
  - Dynamic or invalid packed prefixes
  - DD-021 dynamic mixed-driver relaxation beyond already accepted forms
  - Broad suites before the campaign batch boundary
remaining_consumers: []
