id: S04
title: Execute vacuous user pass actions in single-clock implications
status: active
phase: spec_grounded
base_revision: 61ca5f336
standards:
  - IEEE1800-2017 and IEEE1800-2023 16.12.7 and 16.14.1.
expected_behavior: An enabled assertion implication with no antecedent match succeeds vacuously and executes its user pass action once per starting attempt, without a nonvacuous-success callback.
observed_behavior: False a in a |-> b produces zero pass actions in both editions and both default and legacy engines.
reproducer: ../evidence/campaign-20260908/s04/vacuity.sv
causal_hypothesis: Nonfanout NFA death without an antecedent obligation suppresses pass dispatch; legacy lowering injects only matching antecedents and loses vacuous attempts.
allowed_scope:
  - pform.cc single-clock implication lowering and directly shared action bookkeeping.
  - NFA, legacy and specialized fixed/genvar delay callers implicated by the same missing-vacuity mechanism.
  - Permanent paired regressions, focus manifests and reviewed affected existing test expectations.
  - VPI controls/callback tests needed to distinguish user pass actions from nonvacuous success reports.
  - Active contract, campaign checkpoint, blocker registry, discovered debt, clause matrix and session log.
non_goals:
  - No multiclock architecture expansion or S02 implementation.
  - No unrelated property operators, new unsupported assertion controls, or full SVA/formal qualification claim.
  - No cover-action redesign; preserve existing coverage semantics and S03 parent aggregation.
invariants:
  - One action per starting attempt, including multiple vacuous attempts resolving together.
  - Preserve Preponed sampling, Reactive user actions, disabled/killed attempts and supported assertion controls.
  - Never report a vacuous success as a nonvacuous-success callback.
  - Preserve arbitrary legal user action ownership; no incomplete statement cloning or silent action loss.
  - Preserve explicit legacy mode and existing nonvacuous/failure behavior.
required_gates:
  - Paired red/green in default and legacy modes; overlap/nonoverlap and delayed antecedent/consequence controls.
  - Vacuous/nonvacuous/failure mixtures, cancellation, same-tick multiplicity and callback distinction.
  - Independent standards/implementation review.
  - SVA NFA parity, focused legacy/JSON, integrated ivtest/VPI/negative/runtime, full JSON, real-DPI UVM and make check.
  - Remote CI before merge.
completion: Qualify exact repaired implication paths; retain unsupported paths and unrelated mandatory obligations explicitly.
discovery_policy: Unrelated discoveries are record-only.
stop_after_completion: false
last_validated_revision: 61ca5f336
next_action: Trace every implicated pass-action consumer and antecedent representation before choosing the smallest complete shared correction.
