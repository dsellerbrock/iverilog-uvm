focused_features_before_this: 6
last_validated_revision: Uncommitted L49 tree. Focused legacy 4/4 and JSON 8/8 pass; blocking, compound, delayed NBA capture, function return, two-state arithmetic, constant/dynamic synthesis, and sensitivity controls pass in both applicable editions.
