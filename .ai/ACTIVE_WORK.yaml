expected_behavior: "A VPI-lvalue write to an integral (bit/logic/int) class property reached through another class-typed property (obj.inner.n) must reach the actual inner field, per IEEE1800 clause38.15 -- same as the already-working direct case and L33's string sibling."
root_cause: "Same mechanism as L33: get_vpi_taskfunc_signal_arg's old direct-only CPV fast path required ivl_expr_signal(expr) directly on the property node, null for any nested chain, falling back to a discarded vec4 stack temporary with no error."
fix_summary: "Reused L33's collect_property_chain_() (leaf-type-agnostic) from a new integral call site at the same point L33's string check sits. vvp/parse.y's K_CPV production takes `numbers` for the chain, moved to the END (after width/signed) unlike K_CPS, since CPV has two trailing fixed fields and a chain positioned before them would be LALR(1)-ambiguous -- verified zero new conflicts via bison table diff. vvp/vpi_cobject.cc's __vpiClassPropertyVecVar now holds a property-index path; null-intermediate write reuses L33's report_null_property_container_write_()."
regression_found_and_fixed: "A real bug (not the L33 ivtest race-condition false positive) was found by the ivtest gate: collect_property_chain_()'s IVL_EX_SIGNAL/IVL_EX_ARRAY base-case branch ignored ivl_expr_oper1(base), which carries a word-indexed array-of-class-handles' index (e.g. arr[1].id). Silently treating it as the scalar case emitted a label matching no real functor (vvp 'unresolved functor stub'), reading X instead of the real value. Caught by sv_array_port_object_event and sv_cast_container_task_failure. Fixed by rejecting an array-indexed base (same principle as the already-rejected array-indexed property hop). This bug lived in the SHARED helper, so it retroactively closes a latent, previously-uncaught gap in L33's string path too (documented as an addendum on the L33 BLOCKERS.md entry); reverified via evidence/campaign-20260908/dd046/c12_arr_of_obj.sv and c13_arr_of_obj_str.sv (string analog)."
scope: "Integral (IVL_VT_LOGIC/IVL_VT_BOOL) class properties only, same boundary as L33. real-typed nested properties, array-indexed hops (property-level or signal-base-level), and virtual/polymorphic dispatch remain out of scope, unchanged pre-existing rvalue-only fallback."
