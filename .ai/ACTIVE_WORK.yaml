id: S03
title: Aggregate NFA implication verdicts per starting attempt
status: completed_local
phase: selection
base_revision: 2be79b2c0
standards:
  - IEEE1800-2017 and IEEE1800-2023 16.12.7.
expected_behavior: Each starting implication attempt reports failure once if any consequent fails, and success only after the antecedent closes and all consequences succeed.
observed_behavior: Both editions report two failures for one starting attempt with two failing endpoint consequences.
reproducer: ../evidence/campaign-20260908/s03/attempt-verdict.sv
causal_hypothesis: Existing NFA endpoint fanout dispatches verdicts per consequence; antecedent slots become reusable before all dependent consequences resolve.
allowed_scope:
  - pform.cc pform_sva_nfa_try_assertion parent bookkeeping, existing capacity guards and cancellation/EOS consumers.
  - Existing NFA endpoint tests, local-data controls and exact-output golds whose reviewed expectation is affected.
  - Permanent paired per-attempt assertion regressions and focused manifests.
  - Active contract, campaign checkpoint, blocker registry, clause matrix and session log.
non_goals:
  - No scheduler architecture redesign or multiclock implementation; preserve existing NFA supported shapes.
  - No unrelated SVA defects, application modifications or complete assertion/formal qualification claim.
invariants:
  - Preserve endpoint multiplicity without substituting endpoint counts for per-attempt truth.
  - Preserve Preponed sampling, evaluation/report regions, cancellation and clock boundary timing.
  - Preserve current finite-pool overflow diagnostics and bound acyclic parent lifetimes correctly.
  - Reuse existing mechanisms; record and escalate a proven architecture boundary before broadening.
required_gates:
  - Paired red/green controls for separate endpoints, mixed consequence outcomes and verdict identity.
  - Overlap/nonoverlap, mixed and coincident endpoint outcomes, local snapshots, cancellation, vacuity and EOS.
  - Independent semantic review and implementation review.
  - SVA NFA suite, focused legacy/JSON, integrated ivtest/VPI/negative/runtime, full JSON, real-DPI UVM and make check.
  - Remote CI before merge.
completion: Complete only per-parent verdict aggregation in the existing supported NFA endpoint path after required local gates; retain finite cyclic capacity and unsupported shapes explicitly.
discovery_policy: Unrelated discoveries are record-only.
stop_after_completion: false
