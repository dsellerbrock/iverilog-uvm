id: S06
title: Preserve overridden symbolic SVA cycle delays through elaboration
status: active
phase: reproduced
base_revision: a76c9f67a
standards:
  - IEEE1800-2017 and IEEE1800-2023 value-parameter overrides and sequence cycle delays; verify exact subclauses before implementation.
expected_behavior: An instance override of D changes the timing of ##D; every resulting child obligation is checked on its actual elaborated tick and contributes to one parent verdict. Declaration defaults must not freeze timing.
observed_behavior: With LO1/HI2/D0 defaults and D1 override, a[*LO:HI] |-> ##D q passes at tick2 and ignores q becoming false on tick3. Both editions reproduce on fully locally validated S05.
reproducer: ../evidence/campaign-20260908/s06/parameter-delay-override.sv
causal_hypothesis: The leading and concatenated single-delay grammar calls pform_sva_const_long before preserving overridable expressions; the parameter default is folded into delay_lo/hi and the expression deleted. Range-delay syntax already preserves overridable bounds.
allowed_scope:
  - parse.y and pform.cc single cycle-delay normalization and directly necessary instance-elaborated lowering; audit all affected callers.
  - Preserve legal existing fixed, genvar and parameter delay behavior and S05 parent semantics; implement the exact missing timing without an arbitrary delay or attempt cap.
  - Direct/prefixed symbolic repetitions and neighboring fixed antecedents affected by the common normalization path.
  - Named/positional overrides, dependent parameter expressions and per-instance invalid-bound diagnostics within the selected causal path.
  - Permanent paired regressions, required focused/full validation, review and exact conformance records.
non_goals:
  - No multiclock S02 or nested sequence alias DD-006 implementation.
  - No unrelated operator or formal-backend expansion.
  - No declaration-default fallback, silent dropped assertion or diagnostic-only claim of legal-feature implementation.
invariants:
  - Preserve per-instance parameter expression identity until elaboration.
  - Preserve Preponed sampling, Observed disable checks, asynchronous cancellation, Off/Kill and Reactive action dispatch.
  - Preserve one parent verdict, endpoint-sensitive cover accounting and exact empty/nonempty timing.
  - Do not broaden into a new assertion architecture without a deliberate recorded coordination boundary.
required_gates:
  - Paired pre-fix red/current green with early and late polarity discrimination for overridden delays.
  - Multiple instances, zero/nonzero and beyond-one delays, dependent expressions and negative/unknown bounds where applicable.
  - Focused legacy/JSON, S05 neighboring controls, NFA, integrated ivtest/VPI/negative/runtime, full JSON, real-DPI UVM, make check.
  - Grammar conflict count/signature if parse.y changes; independent standards/source/test review; remote CI before merge.
completion: Qualify the exact repaired cycle-delay scope and retain broader obligations explicitly.
discovery_policy: Unrelated discoveries are record-only; causal prerequisites require preserved reducers/work and a deliberate coordination boundary.
stop_after_completion: false
