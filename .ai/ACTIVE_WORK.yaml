status: reproduced_spec_grounded
branch: agent/ot-spi-class-event-triggered-20260923
baseline: main 6fd804a39; PR339 merged after Ubuntu 24.04 exact-head CI success.
blocker: OT-SPI-CLASS-EVENT-TRIGGERED
goal: Implement per-instance class-event .triggered reads and waits needed by released OpenTitan SPI Device.
standards: IEEE 1800-2017 and 1800-2023 section 15.5.3; triggered remains true for the current time step and wait must handle either same-time trigger order.
failing_reproducer: evidence/opentitan-spi-class-event-triggered-triage-20260923/class_event_triggered.sv fails in both editions with Class event_box has no property ev and a compile-progress fallback warning; the ordinary class-event wait control passes.
expected: Per-instance event reads return one only in the firing time step; another instance remains zero; wait on .triggered wakes correctly; null and invalid forms remain explicit and no fallback fabricates success.
root_cause: Class event member reads enter ordinary class-property expression lookup and fail before per-instance event lowering. VVP already has %evtest/obj and per-instance event wait machinery; expression lowering and wait dependency collection do not reach them.
allowed_scope: elab_expr.cc, elaborate.cc, tgt-vvp/eval_vec4.c, necessary shared declaration for the existing class-event helper, dedicated tests, and coordinator-owned manifests. No new VVP opcode unless source evidence disproves the existing path.
forbidden: Verilator implementation changes, edits to pinned OpenTitan/Caliptra sources, unrelated compiler mechanisms, fallback success, or application DV pass claims from compile alone.
validation: RED and ordinary-wait control rechecked on PR339 source head a338704e4 in both editions; external transcript is ../evidence/ot-class-event-selected-20260923/result.json. Merged main 6fd804a39 contains that exact source. Focused paired-edition behavior and appropriate integrated gates are pending.
