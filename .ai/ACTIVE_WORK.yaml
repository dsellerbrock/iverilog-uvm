id: P01

title: Preserve null and empty parallel child processes
status: completed
phase: locally_validated
base_revision: b9ffa4994
standards:
  - IEEE 1800-2017 clause 9.3.2 and Table 9-1 (verified local LRM text)
  - IEEE 1800-2023 clause 9.3.2 and Table 9-1 (verified local LRM text)
expected_behavior: Null and empty fork children terminate processes and release join_any; join waits for all children and join_none does not suspend its parent.
