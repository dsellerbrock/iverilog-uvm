selection_reason: Explicit residual after V03 and V05; incorrect weights distort routine coverage completion reports even with correct bin counts. This is a direct remaining standard obligation, not a broad audit or selection by ease.
allowed_scope:
  - Declared integral constant type-weight validation and propagation for coverpoints and crosses through existing class IR, target metadata and runtime merged aggregation.
  - Preserve older VVP metadata compatibility and validate new metadata; reuse existing group type-weight mechanisms where appropriate.
  - Paired permanent weight/default/zero/mode/constructor interaction and invalid-value controls; correct existing item-isolation fixtures to declare both type and instance weights, with standards-based evidence rather than weakening their bin assertions.
non_goals:
  - Procedural static type-option assignment, goals/strobe, unsupported topology or transition cardinality redesign.
  - No application edits, formal architecture changes or unrelated cleanup.
invariants:
  - Type and instance weights remain independent; group weights do not become lower-level defaults.
  - No silent acceptance of nonconstant, negative, unknown or otherwise unrepresentable new type-weight metadata.
  - Preserve merge_instances0 weighted-instance semantics, bin identity/count/threshold logic and older bytecode readability.
