flash_vthread_o3_iteration3_checkpoint: "The profiler-backed native build experiment compiled only vvp/vthread.cc with -O3 while all other translation units stayed at -O2. A same-image/default-seed/arguments 1,200-second/10 GB Flash replay timed out at 1,200.6 seconds, peak RSS 1,304,969,216 bytes. It reached the same last checked marker as baseline: operation 2/3, bank-1 FlashPartData erase at 1,414,652.8 ns; no later checked progress or PASS/error/fatal marker appeared. O2 runtime restored. Counter 3/5. Evidence: evidence/opentitan-census-20261002/flash-vthread-o3-iter3-20261003/README.md."
flash_vthread_process_allocation_iteration2_checkpoint: "The profiler-backed experiment skipped the private vvp_process allocation for synchronous task/named-block frames. Four focused process/call/fork regressions passed; a checked 1,000,000-call microbenchmark median improved 3.75% (1.127636 s to 1.085342 s). Same-image/default-seed/args 1,200-second/10 GB Flash replay ended at 1,200.8 s, peak RSS 1,407,877,120 bytes. Its last comparable checked milestone matched the prior run at operation 2/3, bank-1 FlashPartData erase at 1,414,652.8 ns; forced shutdown emitted noOutstandingReqsAtEndOfSim_A and TEST FAILED CHECKS, with no clean PASS. No significant end-to-end speedup established; candidate removed and O2 runtime restored. Counter 2/5. Evidence: evidence/opentitan-census-20261002/flash-vthread-process-allocation-iter2-20261003/README.md."
flash_vpi_full_path_cache_iteration1_checkpoint: "The profiler-backed bounded full-path cache candidate in vvp/vpi_priv.cc passed the same nine VPI regressions and improved the repeated-path synthetic VPI microbenchmark median from 4.567 ms to 2.466 ms for 20,000 lookups (46.0%). A same-image, same-default-seed, same-arguments 1,200-second/10 GB Flash replay reached exactly the prior checked milestone at 1,414,652.8 ns (operation 2/3 bank-1 Data-partition erase); no PASS or UVM error/fatal marker appeared. Peak RSS was 1,266,155,520 bytes versus 1,250,607,104 bytes baseline. Since the full Flash replay showed no measurable simulated-time gain, the candidate implementation was removed. Evidence: evidence/opentitan-census-20261002/flash-vpi-full-path-cache-iter1-20261003/README.md."
