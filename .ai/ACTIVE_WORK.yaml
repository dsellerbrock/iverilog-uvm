goal: "Implement the IEEE 1800-2023 associative-array value-parameter forms and specialization/value use paths requested by issue #450, while preserving 2017 rejection."
standards:
  2017: "§6.20.2 covers value parameters; §8.25 defines class specialization identity; Annex A A.2.4 param_assignment uses {unpacked_dimension}, excluding associative_dimension."
  2023: "§6.20.2 covers value parameters; §8.25(b) requires matching value types and equal values for specialization identity; Annex A A.2.4 param_assignment uses {variable_dimension}, and A.2.5 defines associative_dimension as [data_type] or [*], included by variable_dimension. The issue's §8 title points to §8.25 but grammar is in Annex A."
failing_reproducer: "Self-authored module parameter `parameter int Values[string] = '{\"one\": 7}`: source-built Icarus at af89cfc50 fails under both -g2017 and -g2023 with `Dimension size must be greater than zero` on PEAssocType. Self-authored class parameter `class assoc_table #(int Values[string] = ...)`: Slang accepts under 1800-2023; source-built Icarus syntax-errors under both editions."
expected_semantics: "1800-2023 accepts associative-array value parameters, including class parameter declarations and specialization. 1800-2017 rejects those new direct associative parameter dimensions. A typedef naming an associative-array type remains a legal type parameter in both editions. Distinct class specializations follow §8.25 matching-value-type and value rules."
current_behavior: "Baseline reproduced both failures and the typedef control. Candidate parser, 2023 gate, associative parameter storage/value lookup, and specialization-signature support are implemented. The target emitter now omits associative maps from scalar ivl_parameter_t metadata. The shared fixes are in place; focused legacy/JSON pass 4/4 each, neighboring legacy passes 6/6, neighboring JSON 8/8, and full legacy passes 5,046/5,046. Full JSON completed 4,503 tests with 4 failures: two FPGA CE cases failed because the optional tgt-fpga target was absent from the local install, then passed after installing it and rerunning those cases; the 2017/2023 constraint-state variants still fail at wide_state.flags[64] and are recorded in DD-112. UVM passes 363/363 with real DPI."
root_cause: "parse.y module parameter_assign accepts dimensions_opt but class_type_parameter_port_item had no dimension after its identifier. pform.cc stores parameter dimensions as udims; NetScope::evaluate_parameter_array_ treated them as finite unpacked bounds. The parameter representation and evaluated_parameter_signature_ in elab_scope.cc encoded only known finite bounds plus enumerated scalar elements. t-dll.cc cannot emit the internal associative pattern through scalar-only ivl_parameter_t metadata, so associative maps are omitted from that scalar metadata. For class identity, cache_typed_assoc_literal_ also incorrectly rejected keyed maps because keyed PEAssignPattern nodes populate parm_names; for values, PEIdent::resolve_type_ treated the map index as a character/bit select instead of consuming one associative key."
allowed_scope: "Issue #450 only: 2023 parameter grammar/gating, associative parameter type/value representation, class specialization identity, value/type uses, and paired focused regressions."
forbidden_scope: "No OpenTitan or Caliptra application changes; no unrelated cleanup or CI fixes in this ticket; no broad unrelated type-system rewrite; do not claim more than tests prove."
acceptance: "Direct 2017/2023 citations and edition comparison; positive 2023 module and class forms; 2017 rejection; boundary and specialization identity controls; applicable legacy and JSON registrations; focused and neighboring tests; conformance matrix and blocker update; main-based PR merged only after exact-head CI is green."
evidence: "Local PDFs: 1800-2017 and 1800-2023 in iCloud Documents/Standards. Bison 2.3 from /usr/bin is too old for parse.y; source build/install succeeded with Homebrew Bison 3.8.2. Baseline and candidate grammar counts both: 574 shift/reduce, 1,122 reduce/reduce. `make -j2 install` succeeded after removing temporary trace prints; a clean Ubuntu 24.04 ARM64/GCC build and install succeeded in Docker capped at 4 GB. Focus legacy 4/4, focus JSON 4/4, neighboring legacy 6/6, neighboring JSON 8/8. Full legacy `PATH=../local-install/bin:$PATH perl ./vvp_reg.pl regress-sv.list` completed 5,046/5,046 passed. Full JSON `PATH=../local-install/bin:$PATH python3 ./vvp_reg.py regress-vvp.list` completed 4,503 tests with 4 failures; focused JSON rerun of those cases after `make -C tgt-fpga install` passed both FPGA cases and reproduced the two constraint-state failures. See DD-112. `PATH=local-install/bin:$PATH bash .github/uvm_test.sh` completed 363 passed, 0 failed, 0 skipped with real DPI. Graphify query/path was noisy; source tracing confirmed parse.y -> pform.cc -> net_scope.cc/net_design.cc -> elab_scope.cc specialization signature and PEIdent type resolution."
