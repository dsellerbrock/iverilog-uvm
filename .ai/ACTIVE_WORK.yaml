id: P04
title: Kill live descendants spawned inside synchronous task frames
status: in_progress
phase: reproduced
base_revision: 9a1b6beb3544b4b783a0a67cbd5be6e53c619848
standards:
  - IEEE1800-2017 9.7 process kill terminates process and its spawned subprocesses; synchronous task calls do not create a distinct process.
  - IEEE1800-2023 9.7 explicitly includes all descendant subprocesses, terminated before kill returns.
expected_behavior: Killing a live parent also terminates its child forked inside an automatic task; child cannot continue counter updates.
observed_behavior: Both editions report parent KILLED but child WAITING and counter4to9 after kill.
reproducer: ../evidence/campaign-20260908/u01-after-l07/kill_task_children.sv and kill-task-{2017,2023}.log
root_cause: kill_detached_subprocesses_ walks detached children but misses synchronous task frames in children; do_disable later reparents their detached children alive.
allowed_scope:
  - vvp/vthread.cc process-kill descendant traversal.
  - Focused permanent legacy and JSON process-kill regressions and gold/registry entries.
  - .ai/ACTIVE_WORK.yaml and .ai/CAMPAIGN.yaml.
  - docs/conformance/BLOCKERS.md and session log.
non_goals:
  - Terminal-parent kill DD-014, core-state wait DD-015, unrelated runtime redesign.
  - No application edits, warning suppression, or broad U01 closure.
invariants:
  - Preserve logical process identity and existing disable semantics.
  - Native ARM64, serial build,300second per-process CPU guard, no RSS cap.
  - Preserve sibling worktrees and frozen baseline; do not install while gates run.
required_gates:
  - Paired failing baseline and passing task/named-frame/deep descendant controls; unaffected sibling survives.
  - Focused legacy and JSON regression harnesses; make check and independent review.
  - Required integrated legacy/VPI/negative/runtime, full JSON, real-DPI UVM and NFA gates.
completion: Close only live-parent descendant traversal scope after required gates pass, then replay unmodified U01 at a coordination boundary.
last_validated_revision: 9a1b6beb3544b4b783a0a67cbd5be6e53c619848
discovery_policy: Unrelated findings record-only; patch regressions remain in scope.
stop_after_completion: false
next_action: Trace all callers and frame ownership, implement smallest traversal correction, add permanent paired coverage.
next_command: "rg -n 'kill_detached_subprocesses_' vvp/vthread.cc"
