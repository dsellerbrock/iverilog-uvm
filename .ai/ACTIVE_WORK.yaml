next_action: "Design review resolved (session 2026-09-11, design-facts-20260911.md): single evaluation confirmed for vvp thread-stack systf arguments both editions (single-eval-20260911.log); dispatch needs only 3 cases via vpiObjTypeVal (9=vpiVectorVal for every integral var/const regardless of declared width, 7=vpiRealVal, 8=vpiStringVal; argtypes-20260911.log, types2.sv). IEEE1800 2017/2023 38.15 (2017:69619, 2023:72090) explicitly licenses reading a vpiStringConst with either vpiStringVal or vpiVectorVal. Proposed registration site: a calltf added in uvm_dpi/uvm_recording.cc (not the core vvp systf image), because recording_owners/recording_handles are static to that translation unit and a core-image systf would need a new exported accessor; uvm_dpi_iverilog.cc vlog_startup_routines is currently {0}, so this is the first systf that umbrella registers -- registration success under both -m uvm_dpi and the baked :vpi_module path is UNVERIFIED and must be the first implementation step, not an assumption. String encoding must NOT reuse recording_write/recording_quote, which stops at NUL: L32 permanent regression string_literal_vector.v includes a raw literal with embedded zero bytes, so string literal/expression arguments need a length-carrying encoding, not a C-string one. Object/class-handle, aggregate and enum-schema arguments remain out of scope and must fail loudly. This design is unimplemented; next step is the registration smoke test below, then the encoder, before any red-reducer conversion to green."
next_command: "Add a minimal calltf in uvm_dpi/uvm_recording.cc for $ivl_uvm_record_attribute that only vpi_printfs vpiObjTypeVal and returns, register it via vpi_register_systf, rebuild uvm_dpi, then run local-install/bin/iverilog -g2017 -m \"$PWD/local-install/lib/ivl/uvm_dpi.vpi\" -s main -o /tmp/u15_reg.vvp ../evidence/campaign-20260908/u15/values.sv && vvp -uvm /tmp/u15_reg.vvp to confirm the systf actually resolves under the real loading path before building the encoder on top of it."
