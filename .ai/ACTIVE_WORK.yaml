id: L04
title: Publish automatic integral defaults after activation linkage
status: in_progress
phase: awaiting_validation
parent: L03
base_revision: 4a879babc
standards:
  - IEEE1800-2017 and IEEE1800-2023 6.8,6.21,9.4.2; integral default values and activation-specific event transitions.
expected_behavior: An unchanged partial write to a default-zero automatic bit vector cannot create a negedge; the first real1-to0 transition at time3 must trigger the waiter.
observed_behavior: Both editions wake at time1 on unchanged value[2:1]=0 because event history has never received the activation's default value.
reproducer: ../evidence/campaign-20260908/u01-loop/default-negedge.sv
causal_mechanism: signal4_aa alloc/reset initializes storage but emits no initial value. Context hooks run before stack/live linkage, so publishing there cannot safely identify the activation. Partial writes expose the stale X event history.
allowed_scope:
  - Add a post-link initialization callback to existing automatic_hooks_s and invoke it at all automatic-context allocation call sites.
  - Publish existing automatic integral slot values through their native signal net after activation linkage and before user code/argument writes.
  - Permanent paired default/edge, concurrent/reused/nested activation controls and required full regression/review records.
non_goals:
  - No Boolean operator implementation until L04 is validated and L03 resumes.
  - No scheduler redesign, broad type initialization overhaul or unrelated application changes.
invariants:
  - All context items must exist and ownership/stack linkage must be established before initial publication.
  - Publish existing slot values without changing defaults or manufacturing a user-visible transition in a pre-existing unrelated activation.
  - Preserve input/output marshaling, virtual dispatch,DPI export and synchronous function-call context ownership.
required_gates:
  - Paired pre-fix red/current green plus default X,explicit assignment,unchanged whole/partial writes and activation reuse controls.
  - Audit every context allocation caller and all automatic hook implementations for ordering.
  - Focused legacy/JSON,relevant lifetime neighbors,NFA,integrated,VPI,negative,runtime,fullJSON,real-DPIUVM,makecheck and independent review.
  - Remote CI required before merge.
completion: Qualify bounded automatic integral initial-value propagation, then resume preserved L03; broader types and Boolean operators remain separate.
discovery_policy: Unrelated findings record-only; regressions from this patch remain in scope.
stop_after_completion: false
last_validated_revision: 4a879babc
next_action: Await integrated3537,NFA96096,real-DPIUVM88516; run fullJSON serially after integrated. Preserve source/test freeze.

implementation: Optional initialize_instance hook runs after all items exist and activation is live with applicable stack linkage; all four allocation callers covered. signal4_aa publishes existing integral slot bits through its native net before argument/user writes.
focused_validation: Paired4/4 legacy+JSON; L02neighbors93/93+50/50,mixedlifetime7/7+7/7,eventcontrols14/14+14/14,makecheck and final independent review pass. Saved baseline runtime still fails original/new defaults controls; current passes both editions.
current_sessions: Integrated3537,NFA96096,real-DPIUVM88516 running; no dependent L03 edit.
