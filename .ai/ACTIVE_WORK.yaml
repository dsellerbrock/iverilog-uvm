current_image: "On agent/opentitan-hotpath-repros-20261004 with the generation-guarded AST fix, permanent regression, and default-ROM synthesis overlay committed. Census16's only failures were pre-fix source-order issues; focused corrected-scope reruns passed RV-DM and UART. Census17 is live with the installed pre-candidate compiler; at 2026-10-05 02:50 UTC its persisted result had 28/49 PASS, one OTBN PRE_RUN_FAIL, and 20 targets unreported. The failure is the non-git snapshot/Bash 3.2 fallback setup; use the runner's RV32_TOOL_AS/RV32_TOOL_LD bypass on the next coherent run (prior xPack OTBN passed in 136.853 seconds). The AST reproducer is 20/20 red on baseline and 20/20 green on the candidate, with three related regressions green. Candidate `rom_ctrl` RTL compile passes with the recorded build-local overlay; full refreshed compile census is still required."
flash_assoc_benchmark_checkpoint: "A standalone current-VVP probe inserted 524,288 32-bit associative entries, copied the aggregate, and validated every lookup in 0.539 seconds. This makes that simple map workload an unlikely sole explanation for the Flash timeout; it does not cover the full OpenTitan class/callback, UVM HDL read, DUT, or scheduler path. Source and limits: evidence/opentitan-census-20261002/flash-assoc-benchmark/. No full census was run."
flash_readpath_profile_checkpoint: "A bounded instrumented replay recorded 131,000 read32 calls per Flash bank during partition-model population by 18.541 us, then another 130,000 bank-1 calls during erase checking by 18.967 us. The 600-second replay timed out below 4 GiB (peak 995,476,584 bytes), with no PASS marker. A 10-second macOS sample after about 85 seconds showed uvm_hdl_read in 183/820 main-thread samples; 170 entered vpi_handle_by_name and recursive find_scope. This identifies hierarchical VPI name resolution as a substantial sampled cost, but not a complete runtime root cause. A separate 180-second replay completed all eight traced Z3 checks, including the 46/228-dist checks, then timed out without PASS. See evidence/opentitan-census-20261002/flash-readpath-profile-20261003/. No new full census has run."
flash_vpi_scope_cache_checkpoint: "The VVP find_scope implementation now caches successful parent/name scope resolutions. In a synthetic 1,024-generate-scope benchmark with 20,000 repeated deep-name lookups, five sequential runs measured medians of 0.503704 s pre-cache and 0.004145 s with the rebuilt VVP (about 122x for this scan-heavy microbenchmark). Nine focused VPI regressions passed. A 1,200-second Flash replay with a 10,000,000,000-byte RSS cap reached operation 2/3 and the bank-1 Data-partition erase scoreboard at 1,414,652.8 ns, then hit the wall cap. Peak RSS was 1,250,607,104 bytes, there was no pass marker or UVM error/fatal marker, and no end-to-end speedup is established. Census11 remains the latest coherent result. See evidence/opentitan-census-20261002/flash-vpi-scope-cache-20261003/."
flash_sva_index_checkpoint: "A 1,400-assertion paired 2017/2023 stress regression passes; focused VVP suite passed 22/22. The `(scope, assertion index)` open-addressed index reduced the synthetic 1,400-assertion/1,000-cycle microbenchmark average from 3.070 s to 1.951 s (two runs each), but this is not an end-to-end Flash speedup. A 180-second macOS Time Profiler capture recorded 56,982 VVP samples: `find_scope` 23.8%, UVM HDL lookup and `vpi_handle_by_name` about 5.3% each, and SVA control callbacks under 0.6% each. Its RSS monitor reported zero and did not validate the 10 GB cap. The separate 1,200-second/10 GB run and phase samples are documented in the preceding scope-cache checkpoint. The Flash replay produced no PASS marker; census11 remains 38 PASS, 7 DEBT, 1 FAIL, 2 RUNTIME_FAIL, 1 RUNTIME_TIMEOUT. See evidence/opentitan-census-20261002/flash-sva-control-index-20261003/."
flash_speedup_iteration_policy: "Counter starts at 0/5 additional iterations after checkpoint f0a087371. An iteration is one distinct profiler-backed optimization measured on the same Flash image, seed, arguments, host, and 1,200-second/10 GB envelope; microbenchmark-only gains do not count. Call a speedup significant only if paired measurements show at least 10% better simulated-time throughput to a comparable checked milestone and the gain repeats beyond run-to-run noise. After iteration 5, if no such speedup exists, run flash_ctrl_smoke_vseq once with a 3,600-second wall limit and the same 10,000,000,000-byte RSS cap. If that run emits the checked PASS result with zero UVM errors, fatals, or semantic/runtime debt, run the full 49-target corpus with all current updates. If Flash does not pass, continue focused diagnosis and do not start the full corpus. Current count: 4/5; iterations 1-4 produced no significant end-to-end gain and their candidates were removed or reverted. User explicitly directed on 2026-10-03 to skip iteration 5 and run the 3,600-second replay. It hit the wall cap at 3,600.4 s, peak RSS 1,742,995,456 bytes, with no PASS; it advanced beyond the prior operation-2 marker to operation 4/4. No full corpus was started; see evidence/opentitan-census-20261002/flash-60m-user-directed-fallback-20261003/result.json."
