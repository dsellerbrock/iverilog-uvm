scope_review: Root review found cfg.bits[local_idx] also selects combined target but precise_direct currently
  skips expression filter. Track ordinary non-root dependency and require none for precise_direct, reusing
  existing value-filter for mixed dependencies. Prevent same-value selector changes from falsely resuming caller.
violated_invariant: IEEE9.4.2 event occurrence must survive an expression pulse returning to armed value before
  waiting thread runs. Existing deferred procedural filter misses same-slot selected-vector and selector pulses.
boundary_evidence: evidence/review-20260920/opentitan-mixed-wait-design/frontend/final-boundary/
why_local_fix_insufficient: Synchronous subscription fixes missing dependency but deferred NetDoWhile value
  filter samples final value too late. Removing filter causes false wakes on unchanged selected values; a forked
  evaluator delays arming. Need occurrence-time value evaluation and exact-once/cancellable wake.
proposed_scope: Coordinator-authorized occurrence-time evaluation using existing dispatcher and retained contexts.
  event/object hooks only as required for synchronous publication and cancellation; no unrelated scheduler
  redesign.
observer_frontend: NetEvProbe owns duplicated full expression for existing accepted integral compound class
  event path; export via ivl_event_observer_expr after materializing input signals. Reuse existing mutation-probe
  dedup isolation. Remove deferred filter only when observer target/runtime recipe is ready; no accepted expression
  form silently narrowed.
capture_contract: Capture original selector/owner nodes during existing full-expression evaluation into private
  runtime frame slots; descriptors reuse captured values. No duplicate function execution, unconditional hoisting,
  cross-activation temporaries or structural CSE. Unevaluated branch descriptors inactive. Exact mapping to
  original nodes; frame slots valid only for that evaluation.
