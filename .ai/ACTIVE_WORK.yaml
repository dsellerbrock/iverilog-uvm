flash_60m_fallback_checkpoint: "User-directed after iteration 4/5; the 3,600-second replay hit the wall cap at 3,600.4 seconds without TEST PASSED CHECKS. Peak RSS was 1,742,995,456 bytes under the 10,000,000,000-byte cap; no UVM_ERROR/UVM_FATAL marker appeared. It advanced through the initial 3-operation phase and into a later 4-operation phase, reaching op 4/4 and a last flushed scoreboard marker at 5,622,434.9 ns. No full corpus was started. Next profile target: measure repeated per-word Flash bank invalidation (`uvm_hdl_deposit`) separately from full partition-model population (`read32`); this is a source-backed hypothesis, not a measured root cause. Preserve all existing checks. Evidence: evidence/opentitan-census-20261002/flash-60m-user-directed-fallback-20261003/."
