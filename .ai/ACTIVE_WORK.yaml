  - .ai/ACTIVE_WORK.yaml and .ai/CAMPAIGN.yaml.
  - docs/conformance/BLOCKERS.md, session log and clause matrix bounded updates.
non_goals:
  - No redesign of the coverage engine, database persistence or unrelated coverage goals/strobe.
  - Coverpoint/cross type-option weights and procedural static option access remain separate obligations unless proven prerequisites.
  - No U01 application changes or complete parentV01 qualification claim.
invariants:
  - Preserve V02 default instance weighting and explicit merged mode.
