source_trace: Emitter fixes term_idx to source descriptor position per dimension (elaborate.cc32552+); runtime unsized logical_idx is resolved value, fixed-array index stays logical index, static/transition identities are stable metadata. Instance routes use dense auto_bin ordinals, and cov_dyn_bump incorrectly reuses those ordinals for shared type counters. type_coverage omits both constructed automatic universe and active named properties.
primary_semantics: Both19.11.3 require cross-bin names to be tuples of component bin names; only identical tuples overlap across instances. Verified2017lines38674-38689 and2023lines40593-40607.
approved_design: Per-class/cross-family interned ordered tuples of(term_idx,logical_idx), registered only after successful plan validation; map local auto-bin IDs to canonical type IDs while preserving instance counters. Reuse existing active named property sets and type_count for mixed crosses. Keep selectors, precedence and current domain boundaries unchanged.
design_review: Independent review accepts tuple identity for currently supported choices and requires active named-property union so mixed crosses are not partially counted; this is direct aggregation support, not named-bin selection redesign.

