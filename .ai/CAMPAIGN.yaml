  status: COORDINATOR_AUTHORIZED_IMPLEMENTATION
  violated_invariant: Parent common width/sign must reach context-determined operands before their values are constructed (IEEE11.8.2).
  why_local_fix_fails: Shift-only provenance does not propagate through intervening unary bitwise ternary arithmetic operators; current headroom can alter later division.
  design: evidence/review-20260920/next-joint-distributions/patch-cast/TYPE_BEFORE_VALUE.md
  allowed: Private vvp_z3.cc pure copied-IR width/sign inference plus scoped value-building context within integral cast evaluation; reuse existing identities and aliases.
  boundaries: No inference AST creation, state reads, graph mutation, reference/error registration or RNG use; real value pass alone owns those effects. No new fallback values or dropped constraints.
  acceptance: Core and signed/nestedcontext reducers, typed qfield foreach, fourstate and rollback, exactwidth intermediate overflow/division, selfdetermined fences, mixed original/cast identity; paired editions and constraint neighbors.
  build_owner: Coordinator; compiler emitter unchanged unless a concrete producer defect is separately reviewed.

